/* ============================================================
   6. EVENTS
   ============================================================ */
function flash(text, kind="good") {
  state.msg = { text, kind };
  render();
  setTimeout(() => { if (state.msg && state.msg.text === text) { state.msg = null; render(); } }, 4200);
}

document.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;

  if (act === "veil" && e.target !== el) return;

  switch (act) {
    case "tab":   state.authTab = el.dataset.v; state.msg = null; return render();
    case "go":    state.view = el.dataset.v; state.msg = null; state.search = ""; return render();
    case "signout":
      await sb.auth.signOut();
      state.profile = null; state.authMode = null; state.pendingEmail = "";
      return render();

    case "backtoauth":
      state.authMode = null; state.pendingEmail = ""; state.msg = null; state.authTab = "up";
      return render();

    case "resendconfirm": {
      if (!state.pendingEmail) return;
      state.busy = true; state.msg = null; render();
      const { error } = await sb.auth.resend({ type: "signup", email: state.pendingEmail,
        options: { emailRedirectTo: location.origin + location.pathname } });
      state.busy = false;
      return flash(error ? (error.message || "Could not send it again.") : "Sent. Give it a minute.",
                   error ? "bad" : "good");
    }

    case "forgot": {
      const typed = (document.querySelector("#authform [name=\'email\']") || {}).value || "";
      const addr = typed.trim();
      if (!addr) return flash("Type your email address first, then click this.", "bad");
      state.busy = true; render();
      const { error } = await sb.auth.resetPasswordForEmail(addr,
        { redirectTo: location.origin + location.pathname });
      state.busy = false;
      return flash(error ? (error.message || "Could not send that.")
                         : "Check your email for a link to set a new password.",
                   error ? "bad" : "good");
    }
    case "veil":
    case "close": state.openClient = null; state.activities = []; return render();

    case "new":
      state.openClient = blankClient();
      state.activities = [];
      return render();

    case "open": {
      e.preventDefault();
      const c = state.clients.find(x => x.id === el.dataset.id);
      if (!c) return;
      state.openClient = { ...c };
      state.activities = [];
      render();
      const { data } = await sb.from("activities").select("*").eq("client_id", c.id)
                                .order("created_at",{ascending:false}).limit(50);
      state.activities = data || [];
      return render();
    }

    case "dial": {
      // let the tel: link fire, then log it
      const rid = el.dataset.rid;
      setTimeout(async () => {
        await logActivity(el.dataset.id, "call", "Dialed from the call list.");
      }, 0);
      return;
    }

    /* you got hold of them — the call is finished and drops off the board */
    case "talked": {
      const rid = el.dataset.rid;
      const r = state.reminders.find(x => x.id === rid);
      const what = r ? KINDS[kindKey(r)].label.toLowerCase() : "scheduled";
      const { error } = await sb.from("reminders").update({ done_at: new Date().toISOString() }).eq("id", rid);
      if (error) return flash(error.message, "bad");
      await logActivity(el.dataset.id, "call", `Talked to the client — ${what} call done.`);
      await refresh();
      if (state.openClient) {
        const fresh = state.clients.find(x => x.id === state.openClient.id);
        if (fresh) state.openClient = { ...fresh };
      }
      return flash("Talked to them. Call cleared.");
    }

    /* nobody picked up — it rolls to tomorrow and stays on the board until you reach them */
    case "noanswer": {
      const rid = el.dataset.rid;
      const r = state.reminders.find(x => x.id === rid);
      if (!r) return;
      const tries = Number(r.attempts || 0) + 1;
      const next = isoPlus(1);
      const { error } = await sb.from("reminders")
        .update({ due_date: next, attempts: tries }).eq("id", rid);
      if (error) return flash(error.message, "bad");
      await logActivity(el.dataset.id, "call",
        `No answer (${ordinal(tries)} try). Trying again ${prettyDate(next)}.`);
      await refresh();
      if (state.openClient) {
        const fresh = state.clients.find(x => x.id === state.openClient.id);
        if (fresh) state.openClient = { ...fresh };
      }
      return flash(`No answer. Back on your list ${prettyDate(next)}.`);
    }

    case "quickcb": {
      const n = Number(el.dataset.n);
      const due = isoPlus(n);
      const { error } = await sb.from("reminders").insert({
        client_id: el.dataset.id, agent_id: state.profile.id, due_date: due,
        kind: "followup", note: "Sales follow-up.", auto: false
      });
      if (error) return flash(error.message, "bad");
      await logActivity(el.dataset.id, "note", `Callback set for ${prettyDate(due)}.`);
      await refresh();
      return flash("Callback set for " + prettyDate(due));
    }

    case "delete": {
      if (!confirm("Delete this client and everything attached to them? This cannot be undone.")) return;
      const { error } = await sb.from("clients").delete().eq("id", el.dataset.id);
      if (error) return flash(error.message, "bad");
      state.openClient = null;
      await refresh();
      return flash("Client deleted.");
    }


    case "approve": {
      const { error } = await sb.from("profiles").update({ status: "active" }).eq("id", el.dataset.id);
      if (error) return flash(error.message, "bad");
      await refresh(); return flash("Agent approved.");
    }
    case "deny":
    case "disable": {
      const { error } = await sb.from("profiles").update({ status: "disabled" }).eq("id", el.dataset.id);
      if (error) return flash(error.message, "bad");
      await refresh(); return flash("Access turned off.");
    }
    case "makemanager": {
      const row = state.team.find(t => t.agent_id === el.dataset.id) || {};
      const who = row.full_name || row.email || "this agent";
      if (!confirm(`Give ${who} full manager access?\n\nThey'll be able to see EVERY agent's book and production, approve or turn off agents, and promote others. Only do this for a true manager or partner.`)) return;
      const { error } = await sb.from("profiles").update({ role: "admin", status: "active" }).eq("id", el.dataset.id);
      if (error) return flash(error.message, "bad");
      await refresh(); return flash(`${who} is now a manager.`);
    }
    case "removemanager": {
      if (el.dataset.id === state.profile.id) return flash("You can't remove your own manager access.", "bad");
      const row = state.team.find(t => t.agent_id === el.dataset.id) || {};
      const who = row.full_name || row.email || "this manager";
      if (!confirm(`Remove manager access from ${who}?\n\nThey'll go back to seeing only their own book.`)) return;
      const { error } = await sb.from("profiles").update({ role: "agent" }).eq("id", el.dataset.id);
      if (error) return flash(error.message, "bad");
      await refresh(); return flash(`${who} is back to an agent.`);
    }
    case "scopeto": {
      state.adminScope = el.dataset.id; state.view = "today";
      await refresh(); return;
    }
    case "copysetup": {
      const link = location.origin + location.pathname + "#k=" + encodeURIComponent(SUPABASE_ANON_KEY);
      try {
        await navigator.clipboard.writeText(link);
        return flash("Setup link copied. Send that to an agent and they just open it once.");
      } catch (err) {
        return flash("Could not reach the clipboard. The link is this page's address with #k= and the key on the end.", "bad");
      }
    }
    case "export": return exportCSV();
    case "exportleads": return exportLeadsCSV();
    case "leadfilter": state.leadFilter = el.dataset.v; return render();
    case "bookstate":  state.bookState  = el.dataset.v; return render();
    case "toggleimport": state.showImport = !state.showImport; state.importError = null; return render();

    case "newlead":
      state.openLead = { full_name:"", phone:"", email:"", date_of_birth:"", city:"", state:"",
                         source:"", status:"new", callback_at:"", notes:"" };
      return render();

    case "openlead": {
      e.preventDefault();
      const l = state.leads.find(x => x.id === el.dataset.id);
      if (l) { state.openLead = { ...l }; render(); }
      return;
    }
    case "closelead": state.openLead = null; return render();

    case "dialLead": {
      const l = state.leads.find(x => x.id === el.dataset.id);
      if (!l) return;
      await sb.from("leads").update({
        call_count: (l.call_count || 0) + 1,
        last_called_at: new Date().toISOString(),
        status: l.status === "new" ? "working" : l.status
      }).eq("id", l.id);
      await refresh();
      return;
    }

    case "leadcb": {
      const due = isoPlus(Number(el.dataset.n));
      const { error } = await sb.from("leads")
        .update({ callback_at: due, status: "working" }).eq("id", el.dataset.id);
      if (error) return flash(error.message, "bad");
      state.openLead = null;
      await refresh();
      return flash("Callback set for " + prettyDate(due));
    }

    case "deletelead": {
      if (!confirm("Delete this lead?")) return;
      const { error } = await sb.from("leads").delete().eq("id", el.dataset.id);
      if (error) return flash(error.message, "bad");
      state.openLead = null;
      await refresh();
      return flash("Lead deleted.");
    }

    case "convert": {
      const l = state.leads.find(x => x.id === el.dataset.id);
      if (!l) return;
      const { data, error } = await sb.from("clients").insert({
        agent_id: state.profile.id,
        full_name: l.full_name, phone: l.phone, email: l.email,
        date_of_birth: l.date_of_birth || null, city: l.city, state: l.state,
        notes: l.notes, sale_date: todayISO()
      }).select().single();
      if (error) return flash(error.message, "bad");
      await sb.from("leads").update({ status: "converted", converted_client_id: data.id, callback_at: null }).eq("id", l.id);
      await logActivity(data.id, "created", `Converted from a lead. ${l.source ? "Source: " + l.source + "." : ""}`.trim());
      state.openLead = null;
      await refresh();
      state.openClient = { ...data };
      render();
      return flash("Moved over to clients. Fill in the policy and the calls start booking.");
    }

    /* ----- screenshot import ----- */
    case "pickfile": {
      const input = document.getElementById("leadshot");
      if (input && !state.importBusy) input.click();
      return;
    }
    case "droprow": {
      state.importRows = state.importRows.filter((_,i) => i !== Number(el.dataset.i));
      if (!state.importRows.length) state.importRows = null;
      return render();
    }
    case "readpaste": {
      const box = document.getElementById("leadpaste");
      return readPastedList(box ? box.value : "");
    }
    case "cancelimport":
      state.importRows = null; state.importError = null;
      state.importLocal = false; state.importStage = ""; return render();

    case "saveimport": return saveImport();

    /* ----- the practice trainer on the Training tab ----- */
    case "rep-new": {
      state.rep = { pi: (state.rep.pi + 1) % REP_PROSPECTS.length, beat: 0, revealed: {}, scored: false, scores: null, fix: "" };
      return render();
    }
    case "rep-next": {
      const p = REP_PROSPECTS[state.rep.pi % REP_PROSPECTS.length];
      if (state.rep.beat < p.beats.length) state.rep.beat++;
      if (state.rep.beat >= p.beats.length && !state.rep.scores) state.rep.scores = REP_DIMS.map(() => 5);
      return render();
    }
    case "rep-reveal": {
      state.rep.revealed[Number(el.dataset.i)] = true;
      return render();
    }
    case "rep-call": {
      return startVoiceCall(REP_PROSPECTS[state.rep.pi % REP_PROSPECTS.length]);
    }
    case "vc-done": {
      if (VC.resolveTurn) VC.resolveTurn();
      return;
    }
    case "vc-hint-btn": {
      const h = document.getElementById("vc-hint");
      if (h && window.__vcModel) h.textContent = window.__vcModel;
      return;
    }
    case "vc-hangup": {
      endVoiceCall(false);
      return;
    }
    case "vc-score": {
      if (VC.smartHistory && VC.smartHistory.length) {
        vcStatus("Scoring your call…", "");
        const ctr = document.querySelector(".vc-controls"); if (ctr) ctr.innerHTML = "";
        await scoreSmartCall();
      } else if (VC.localLog && VC.localLog.length) {
        scoreLocalCall();
      }
      endVoiceCall(true);
      return;
    }
    case "vc-again": {
      const root = document.getElementById("callroot"); if (root) root.innerHTML = "";
      VC.hangup = false;
      return startVoiceCall(REP_PROSPECTS[state.rep.pi % REP_PROSPECTS.length]);
    }
  }
});

/* ---------- auth actions ---------- */
async function doSetPassword(form) {
  const f = Object.fromEntries(new FormData(form));
  if (f.password !== f.password2) return flash("Those two do not match.", "bad");
  if (String(f.password).length < 8) return flash("Eight characters minimum.", "bad");
  state.busy = true; state.msg = null; render();
  const { error } = await sb.auth.updateUser({ password: f.password });
  state.busy = false;
  if (error) return flash(error.message || "Could not save that password.", "bad");
  state.authMode = null;
  await bootSession();
  flash("Password saved. You are signed in.");
}

async function doAuth(form) {
  const f = Object.fromEntries(new FormData(form));
  state.busy = true; state.msg = null; render();
  try {
    if (state.authTab === "in") {
      const { error } = await sb.auth.signInWithPassword({ email: f.email.trim(), password: f.password });
      if (error) throw error;
    } else {
      const { data, error } = await sb.auth.signUp({
        email: f.email.trim(), password: f.password,
        options: {
          data: { full_name: f.full_name, phone: f.phone },
          // Come back to wherever they actually signed up from, not to whatever
          // the project's default Site URL happens to be.
          emailRedirectTo: location.origin + location.pathname,
        }
      });
      if (error) throw error;
      // Unless email confirmation is switched on, Supabase hands back a live
      // session right here. Walk straight in. Making someone re-type the
      // password they chose four seconds ago is how a working button gets
      // reported as "nothing happens".
      if (data && data.session) { await bootSession(); return; }
      // No session came back, which means email confirmation is switched on.
      // Send them to a screen that says so plainly, with a way to resend.
      state.busy = false;
      state.pendingEmail = f.email.trim();
      state.authMode = "confirm-sent";
      state.msg = null;
      return render();
    }
    await bootSession();
  } catch (err) {
    state.busy = false;
    flash(err.message || "That did not work.", "bad");
  }
}

/* ---------- client save ---------- */
function blankClient() {
  return { full_name:"", date_of_birth:"", phone:"", email:"", street:"", city:"", state:"", zip:"",
           height:"", weight:"", ssn_last4:"", beneficiary:"", beneficiary_phone:"",
           beneficiary2:"", beneficiary2_phone:"",
           sale_date:"", policy_start_date:"", carrier:"", policy_number:"",
           coverage_amount:null, term_years:null, monthly_premium:null, draft_day:null,
           health_notes:"", notes:"" };
}

async function saveClient(form) {
  const f = Object.fromEntries(new FormData(form));
  const isNew = !state.openClient.id;
  const wasSold = isSold(state.openClient);

  /* Only the fields actually on the form are sent. Anything not on the form
     (address, beneficiary, SSN last 4, underwriting notes) is left exactly as
     it is in the database rather than blanked out. */
  const row = {
    ...f,
    full_name:         (f.full_name || "").trim(),
    date_of_birth:     f.date_of_birth     || null,
    policy_start_date: f.policy_start_date || null,
    coverage_amount:   f.coverage_amount   === "" ? null : Number(f.coverage_amount),
    monthly_premium:   f.monthly_premium   === "" ? null : Number(f.monthly_premium),
    // the start date IS the day they pay, so the monthly draft day follows from it
    draft_day:         f.policy_start_date ? parseISO(f.policy_start_date).getDate() : null,
  };
  // a client you add is a client you sold: dated the day you add them
  if (isNew) row.sale_date = todayISO();

  state.busy = true; render();
  try {
    let clientId = state.openClient.id;
    if (isNew) {
      row.agent_id = state.profile.id;
      const { data, error } = await sb.from("clients").insert(row).select().single();
      if (error) throw error;
      clientId = data.id;
      await logActivity(clientId, "created", `Added ${row.full_name}.`);
    } else {
      const { error } = await sb.from("clients").update(row).eq("id", clientId);
      if (error) throw error;
      if (!wasSold && row.sale_date) {
        await logActivity(clientId, "sold", `Marked sold, dated ${prettyDate(row.sale_date)}.`);
      }
    }
    state.busy = false;
    state.openClient = null;
    await refresh();

    const justSold = !wasSold && !!row.sale_date;
    if (justSold && row.policy_start_date) {
      flash(`Saved. ${row.full_name} is on the book — the draft call and the 3, 6, 9 and 12 month checks are booked.`);
    } else if (justSold) {
      flash(`Saved. ${row.full_name} is on the book. Add a start date to get their calls booked.`);
    } else if (row.policy_start_date && row.sale_date) {
      flash(`Saved. Persistency calls booked around the ${prettyDate(row.policy_start_date)} start date.`);
    } else {
      flash("Saved.");
    }
  } catch (err) {
    state.busy = false;
    flash(err.message || "Could not save.", "bad");
  }
}

/* ---------- saving a lead ---------- */
async function saveLead(form) {
  const f = Object.fromEntries(new FormData(form));
  const isNew = !state.openLead.id;
  const row = {
    ...f,
    full_name:     (f.full_name || "").trim(),
    state:         (f.state || "").toUpperCase(),
    date_of_birth: f.date_of_birth || null,
    callback_at:   f.callback_at   || null,
  };
  state.busy = true; render();
  try {
    if (isNew) {
      row.agent_id = state.profile.id;
      const { error } = await sb.from("leads").insert(row);
      if (error) throw error;
    } else {
      const { error } = await sb.from("leads").update(row).eq("id", state.openLead.id);
      if (error) throw error;
    }
    state.busy = false; state.openLead = null;
    await refresh();
    flash("Saved.");
  } catch (err) {
    state.busy = false;
    flash(err.message || "Could not save.", "bad");
  }
}

/* ============================================================
   SCREENSHOT IMPORT
   The picture goes to a function on your own project, which asks a
   vision model to read the table. Nothing is written to the database
   until the agent has looked at the rows and pressed Save.
   ============================================================ */
/* ============================================================
   READING A SCREENSHOT WITHOUT AN API KEY

   The paid reader (an edge function calling a vision model) is better and
   handles handwriting. When it has no key, we fall back to reading the text
   in the agent's own browser instead — free, no account, nothing to set up.
   It only works on screenshots where the text is already typed: a lead list
   out of a dialer, a spreadsheet. It cannot read handwriting, and it says so.

   The agent always checks the result in the review table before anything
   saves, which is what makes an imperfect reader safe to use.
   ============================================================ */
const OCR_SRC = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
let ocrLib = null;

function ensureOcr() {
  if (ocrLib) return Promise.resolve(ocrLib);
  if (window.Tesseract) { ocrLib = window.Tesseract; return Promise.resolve(ocrLib); }
  return new Promise((res, rej) => {
    const el = document.createElement("script");
    el.src = OCR_SRC;
    el.onload = () => { ocrLib = window.Tesseract; ocrLib ? res(ocrLib) : rej(new Error("reader failed to start")); };
    el.onerror = () => rej(new Error(
      "Could not download the reader. Check you are online, then try again."));
    document.head.appendChild(el);
  });
}

/* Scale up and flatten the picture. Small text out of a phone screenshot
   reads far better at 2x with the colour taken out of it. */
function prepForOcr(file) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(3, Math.max(1.5, 1600 / Math.max(img.width, 1)));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      const g = c.getContext("2d");
      g.imageSmoothingEnabled = true;
      g.imageSmoothingQuality = "high";
      g.drawImage(img, 0, 0, c.width, c.height);
      const d = g.getImageData(0, 0, c.width, c.height);
      const px = d.data;
      for (let i = 0; i < px.length; i += 4) {
        let v = 0.299 * px[i] + 0.587 * px[i+1] + 0.114 * px[i+2];
        v = (v - 128) * 1.45 + 128;               // push the contrast up
        v = v < 0 ? 0 : v > 255 ? 255 : v;
        px[i] = px[i+1] = px[i+2] = v;
      }
      g.putImageData(d, 0, 0);
      c.toBlob(b => b ? res(b) : rej(new Error("could not prepare the image")), "image/png");
    };
    img.onerror = () => rej(new Error("That image could not be opened."));
    img.src = URL.createObjectURL(file);
  });
}

const US_STATES = ("AL AK AZ AR CA CO CT DE FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH "
  + "NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY DC").split(" ");

/* pull a 10-digit US number out of a line, however it is punctuated */
function grabPhone(line) {
  const m = line.match(/(?:\+?1[\s.\-]?)?\(?([2-9]\d{2})\)?[\s.\-]?([2-9]\d{2})[\s.\-]?(\d{4})(?!\d)/);
  return m ? `${m[1]}-${m[2]}-${m[3]}` : "";
}

/* a date of birth in any of the shapes a dialer or spreadsheet prints */
function grabDob(line) {
  let m = line.match(/\b(19|20)(\d{2})[\/\-.](0?[1-9]|1[0-2])[\/\-.](0?[1-9]|[12]\d|3[01])\b/);
  if (m) return `${m[1]}${m[2]}-${String(m[3]).padStart(2,"0")}-${String(m[4]).padStart(2,"0")}`;
  m = line.match(/\b(0?[1-9]|1[0-2])[\/\-.](0?[1-9]|[12]\d|3[01])[\/\-.]((?:19|20)?\d{2})\b/);
  if (!m) return "";
  let y = m[3];
  if (y.length === 2) y = (Number(y) > 30 ? "19" : "20") + y;   // a 1948 birthday, not 2048
  const d = `${y}-${String(m[1]).padStart(2,"0")}-${String(m[2]).padStart(2,"0")}`;
  const t = new Date(d + "T00:00:00");
  if (isNaN(t) || t > new Date()) return "";
  return d;
}

function grabState(line) {
  const m = line.toUpperCase().match(new RegExp("(?:^|[,\\s|])(" + US_STATES.join("|") + ")(?:[\\s,|]|$)"));
  return m ? m[1] : "";
}

/* A phone number or a date is the anchor on a table row: whatever sits in
   front of the first one of those is the person's name. That holds for a
   dialer list, a spreadsheet, and a name-on-its-own-line phone screenshot. */
const PHONE_RE = /(?:\+?1[\s.\-]?)?\(?[2-9]\d{2}\)?[\s.\-]?[2-9]\d{2}[\s.\-]?\d{4}/;
const DATE_RE  = /\b\d{1,4}[\/\-.]\d{1,2}[\/\-.]\d{2,4}\b/;
const JUNK_WORDS = /\b(new|open|working|called|call|callback|contacted|no answer|noanswer|not interested|bad number|wrong number|dnc|do not call|lead|leads|list|age|male|female|mr|mrs|ms|of|to|showing|entries|results|total|page|rows?|selected)\b/gi;
/* words that mean the line is a title, a footer or a column of something —
   never a person, however much it looks like two capitalised words */
const NOT_A_NAME = /\b(expense|insurance|final|policy|report|export|campaign|dialer|dashboard|filter|search|import|download|upload|sheet|table|batch|county|company|agency|premium|coverage|carrier|status|source)\b/i;

function titleCase(s) {
  return s.toLowerCase().replace(/(^|[\s'\-])([a-z])/g, (_, a, b) => a + b.toUpperCase());
}

function cleanWords(s) {
  return s.replace(JUNK_WORDS, " ")
          .replace(/[^A-Za-z'.\- ]/g, " ")
          .replace(/\s+/g, " ").trim()
          .split(" ").filter(w => w.length > 1 || /^[A-Za-z]\.?$/.test(w));
}

/* Everything in front of the first phone number or date is the name.
   With neither on the line, cut at the state instead, then take what is left. */
function grabName(line) {
  if (NOT_A_NAME.test(line) && !PHONE_RE.test(line)) return "";

  const cutAt = [PHONE_RE, DATE_RE]
    .map(re => { const m = line.match(re); return m ? m.index : -1; })
    .filter(i => i >= 0);

  let head = cutAt.length ? line.slice(0, Math.min(...cutAt)) : line;
  let words = cleanWords(head);

  // nothing in front of the number (phone-first columns) — try the rest of it
  if (!words.length && cutAt.length) words = cleanWords(line);

  const name = [];
  let hitState = false;
  for (const w of words) {
    if (US_STATES.includes(w.toUpperCase()) && name.length >= 1) { hitState = true; break; }
    name.push(w);
    if (name.length === 4) break;
  }
  // "June Baptiste Poway CA" — with no number to anchor on, the word sitting
  // right before the state is the town, not a third given name
  if (hitState && !cutAt.length && name.length >= 3) name.pop();

  const out = name.join(" ").trim();
  if (out.length < 3) return "";
  if (!/[A-Za-z]{2}/.test(out)) return "";
  if (!/[aeiouyAEIOUY]/.test(out)) return "";   // OCR noise, not a name
  return titleCase(out);
}

/* The city is what sits between the last number on the line and the state. */
function grabCity(line, st, name) {
  if (!st) return "";
  const up = line.toUpperCase();
  const i = up.lastIndexOf(st);
  if (i <= 0) return "";

  let before = line.slice(0, i);
  let last = -1;
  const g = new RegExp(PHONE_RE.source + "|" + DATE_RE.source, "g");
  let m;
  while ((m = g.exec(before))) last = m.index + m[0].length;
  if (last > 0) before = before.slice(last);

  const w = cleanWords(before);
  if (!w.length) return "";

  // if all we have left is the name itself, there is no city on this line
  const nameWords = (name || "").toLowerCase().split(" ").filter(Boolean);
  const kept = w.filter(x => !nameWords.includes(x.toLowerCase()));
  if (!kept.length) return "";

  const cand = kept.slice(-2).join(" ");
  return cand.length >= 3 ? titleCase(cand) : "";
}

const HEADER_WORDS = /(full\s*name|first\s*name|last\s*name|phone|number|mobile|cell|d\.?o\.?b|date\s*of\s*birth|birth|city|state|status|source|age|notes?|address|zip|email|county|list|campaign)/i;

function looksLikeHeader(line) {
  return HEADER_WORDS.test(line) && !PHONE_RE.test(line) && !DATE_RE.test(line);
}

/* One line of recognised text, sorted into the pieces we care about. */
function classifyLine(line) {
  // "Chula Vista, CA" sitting on a line of its own
  const cs = line.match(/^([A-Za-z][A-Za-z .'\-]{1,28}),\s*([A-Za-z]{2})\.?$/);
  if (cs && US_STATES.includes(cs[2].toUpperCase())) {
    return { kind: "place", city: titleCase(cs[1].trim()), state: cs[2].toUpperCase() };
  }
  const phone = grabPhone(line);
  const dob   = grabDob(line);
  const state = grabState(line);
  const name  = grabName(line);
  const city  = grabCity(line, state, name);
  if (name) return { kind: "name", name, phone, dob, state, city };
  if (phone || dob) return { kind: "data", name: "", phone, dob, state, city };
  return { kind: "skip" };
}

/* Turn the raw recognised text into rows for the review table.

   Two shapes have to work. A table puts one person on one line. A phone
   screenshot stacks them — name, then the number, then the town — so a line
   carrying no name is treated as more of the person above it. */
function parseLeadLines(text) {
  const out = [];
  let cur = null;

  // A row has to carry something a person actually has — a number, a birthday,
  // a state. A pair of capitalised words on their own is a page title.
  const flush = () => {
    if (!cur) return;
    const has = !!(cur.phone || cur.date_of_birth || cur.state);
    const keep = cur.full_name
      ? has                                       // a name plus something real
      : !!(cur.phone && (cur.date_of_birth || cur.state));  // no name: needs more than a number
    if (keep) out.push(cur);
    cur = null;
  };

  for (const raw of String(text || "").split(/\r?\n/)) {
    const line = raw.replace(/\s+/g, " ").trim();
    if (line.length < 3) continue;
    if (looksLikeHeader(line)) continue;

    const c = classifyLine(line);
    if (c.kind === "skip") continue;

    if (c.kind === "place") {
      if (cur && !cur.city) { cur.city = c.city; cur.state = cur.state || c.state; }
      continue;
    }
    if (c.kind === "name") {
      flush();
      cur = { full_name: c.name, phone: c.phone, date_of_birth: c.dob, city: c.city, state: c.state };
      continue;
    }
    // a bare data line: more of the person above, if they are still missing it
    if (cur && ((c.phone && !cur.phone) || (c.dob && !cur.date_of_birth))) {
      if (c.phone && !cur.phone) cur.phone = c.phone;
      if (c.dob && !cur.date_of_birth) cur.date_of_birth = c.dob;
      if (c.state && !cur.state) cur.state = c.state;
      if (c.city && !cur.city) cur.city = c.city;
      continue;
    }
    flush();
    cur = { full_name: "", phone: c.phone, date_of_birth: c.dob, city: c.city, state: c.state };
  }
  flush();

  const seen = new Set();
  return out.filter(r => {
    const key = (r.phone || "") + "|" + (r.full_name || "").toLowerCase();
    if (key === "|") return false;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

/* ============================================================
   Reading a pasted lead list.

   Copying rows out of a dialer or a spreadsheet gives you tab-separated
   text; a saved export gives you commas. Either way the characters are
   exact — there is nothing to recognise and nothing to get wrong. This
   works out which column is which, whether or not there is a header row.
   ============================================================ */

/* one line of delimited text -> its cells, honouring "quoted, fields" */
function splitCells(line, delim) {
  const out = [];
  let cur = "", q = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (q) {
      if (c === '"' && line[i+1] === '"') { cur += '"'; i++; }
      else if (c === '"') q = false;
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === delim) { out.push(cur); cur = ""; }
    else cur += c;
  }
  out.push(cur);
  return out.map(s => s.trim());
}

function pickDelimiter(lines) {
  const score = d => {
    const counts = lines.map(l => splitCells(l, d).length).filter(n => n > 1);
    if (counts.length < Math.max(1, Math.floor(lines.length * 0.6))) return 0;
    const mode = counts.sort((a,b) => a-b)[Math.floor(counts.length/2)];
    return counts.filter(n => n === mode).length * mode;
  };
  const tab = score("\t"), comma = score(","), semi = score(";"), pipe = score("|");
  const best = Math.max(tab, comma, semi, pipe);
  if (!best) return null;
  return tab === best ? "\t" : semi === best ? ";" : pipe === best ? "|" : ",";
}

const HEAD_MAP = [
  [/^(full[\s_-]*name|name|lead[\s_-]*name|client[\s_-]*name|contact)$/i, "full_name"],
  [/^(first[\s_-]*name|first|fname|given[\s_-]*name)$/i, "first"],
  [/^(last[\s_-]*name|last|lname|surname|family[\s_-]*name)$/i, "last"],
  [/(phone|mobile|cell|tel|number)/i, "phone"],
  [/(d\.?o\.?b|date[\s_-]*of[\s_-]*birth|birth[\s_-]*date|birthday|born)/i, "date_of_birth"],
  [/^(city|town|municipality)$/i, "city"],
  [/^(state|st|province|region)$/i, "state"],
];

function headerRole(cell) {
  const t = String(cell || "").trim();
  if (!t) return null;
  for (const [re, role] of HEAD_MAP) if (re.test(t)) return role;
  return null;
}

/* is this first row a header, or is it already a person? */
function isHeaderRow(cells) {
  if (cells.some(c => grabPhone(c) || grabDob(c))) return false;
  const named = cells.filter(c => headerRole(c)).length;
  return named >= 2 || (named >= 1 && cells.length <= 2);
}

const YEARLESS = /^\d{1,2}[\/\-.]\d{1,2}$/;

/* no header row: work out each column from what is actually in it */
function inferRoles(rows) {
  const width = Math.max(...rows.map(r => r.length));
  const roles = new Array(width).fill(null);
  const col = i => rows.map(r => (r[i] || "").trim()).filter(Boolean);
  const most = (vals, test) => vals.length && vals.filter(test).length / vals.length >= 0.6;

  for (let i = 0; i < width; i++) {
    const v = col(i);
    if (!v.length) continue;
    if (most(v, x => !!grabPhone(x))) { roles[i] = "phone"; continue; }
    if (most(v, x => !!grabDob(x) || YEARLESS.test(x))) { roles[i] = "date_of_birth"; continue; }
    if (most(v, x => US_STATES.includes(x.toUpperCase()))) { roles[i] = "state"; continue; }
    if (most(v, x => /[A-Za-z]{2}/.test(x))) roles[i] = "text";
  }

  // the text columns in front of the first number are the name
  const firstData = roles.findIndex(r => r === "phone" || r === "date_of_birth" || r === "state");
  const before = [], after = [];
  roles.forEach((r, i) => { if (r === "text") ((firstData < 0 || i < firstData) ? before : after).push(i); });

  if (before.length >= 2) { roles[before[0]] = "first"; roles[before[1]] = "last"; }
  else if (before.length === 1) roles[before[0]] = "full_name";
  else if (after.length) roles[after.shift()] = "full_name";

  // the last remaining text column is the town
  const left = roles.map((r,i) => r === "text" ? i : -1).filter(i => i >= 0);
  if (left.length) roles[left[left.length - 1]] = "city";
  roles.forEach((r, i) => { if (r === "text") roles[i] = null; });
  return roles;
}

function rowFromCells(cells, roles) {
  const g = role => { const i = roles.indexOf(role); return i < 0 ? "" : (cells[i] || "").trim(); };
  let name = g("full_name");
  if (!name) name = [g("first"), g("last")].filter(Boolean).join(" ");
  // "Whitfield, Ada" out of a spreadsheet is one column, back to front
  if (/^[A-Za-z'\-. ]+,\s*[A-Za-z'\-. ]+$/.test(name)) {
    const [l, f] = name.split(",");
    name = `${f.trim()} ${l.trim()}`;
  }
  name = name.replace(/\s+/g, " ").trim();
  if (!/[A-Za-z]{2}/.test(name)) name = "";   // "-", "n/a", punctuation: not a name
  const st = g("state").toUpperCase();
  return {
    full_name: name,
    phone: grabPhone(g("phone")) || grabPhone(cells.join(" ")),
    date_of_birth: grabDob(g("date_of_birth")),
    city: g("city"),
    state: US_STATES.includes(st) ? st : "",
  };
}

/* Turn pasted text into rows for the review table.
   Returns { rows, skipped } — skipped is how many lines carried nothing. */
function parsePastedList(text) {
  const lines = String(text || "").split(/\r?\n/).map(l => l.replace(/\s+$/, "")).filter(l => l.trim());
  if (!lines.length) return { rows: [], skipped: 0 };

  const delim = pickDelimiter(lines);
  // no columns at all — it is loose text, read it the same way a picture is read
  if (!delim) return { rows: parseLeadLines(lines.join("\n")), skipped: 0 };

  let grid = lines.map(l => splitCells(l, delim));
  let roles = null;

  if (isHeaderRow(grid[0])) {
    roles = grid[0].map(headerRole);
    grid = grid.slice(1);
  }
  if (!grid.length) return { rows: [], skipped: 0 };
  if (!roles || !roles.some(Boolean)) roles = inferRoles(grid);

  const rows = [];
  const seen = new Set();
  let skipped = 0;
  for (const cells of grid) {
    if (!cells.some(c => c.trim())) continue;
    const r = rowFromCells(cells, roles);
    if (!r.full_name && !r.phone) { skipped++; continue; }
    const key = (r.phone || "") + "|" + r.full_name.toLowerCase();
    if (seen.has(key)) { skipped++; continue; }
    seen.add(key);
    rows.push(r);
  }
  return { rows, skipped };
}

function readPastedList(text) {
  state.pasteText = text;
  state.importError = null;
  state.importLocal = false;

  if (!String(text || "").trim()) {
    state.importError = "Nothing pasted yet. Copy the rows out of your dialer or your spreadsheet first.";
    return render();
  }

  let out;
  try { out = parsePastedList(text); }
  catch (err) { state.importError = "Could not make sense of that. " + (err.message || ""); return render(); }

  if (!out.rows.length) {
    state.importError = "No people found in that. Each person needs to be on their own line, "
      + "with at least a name or a phone number on it.";
    return render();
  }

  state.importRows = out.rows;
  state.pasteText = "";
  render();
  if (out.skipped) flash(`${out.skipped} line${out.skipped===1?"":"s"} had no name or number on it and ${out.skipped===1?"was":"were"} left out.`);
}

async function readInBrowser(file) {
  const T = await ensureOcr();
  const blob = await prepForOcr(file);
  const { data } = await T.recognize(blob, "eng", {
    // the small language model: 1.9MB instead of 11MB, which matters on a
    // phone. It is downloaded once and then kept in the browser.
    langPath: "https://tessdata.projectnaptha.com/4.0.0_fast",
    gzip: true,
  });
  return parseLeadLines(data && data.text);
}

/* The smart reader is not available (not installed, no key on it, or it fell
   over). Read the picture in the agent's own browser instead. Free, needs no
   account, and if a key is added later this path simply stops being reached. */
async function fallbackToBrowser(file) {
  try {
    state.importBusy = true; state.importError = null;
    state.importStage = "Reading it on this device. Give it a few seconds — do not close the page.";
    render();

    const rows = await readInBrowser(file);
    state.importBusy = false; state.importStage = "";

    if (!rows.length) {
      state.importLocal = false;
      state.importError =
        "Nothing readable in that picture. This device can only read text that is already "
        + "typed — a dialer list or a spreadsheet — not handwriting. "
        + "Try a tighter, straighter shot, or type them in by hand.";
      return render();
    }

    state.importLocal = true;
    state.importRows = rows;
    return render();
  } catch (err) {
    state.importBusy = false; state.importStage = ""; state.importLocal = false;
    state.importError = (err && err.message) || "Could not read that screenshot.";
    return render();
  }
}

async function readScreenshot(file) {
  if (!file.type.startsWith("image/")) {
    state.importError = "That is not an image. Screenshot the table and try again.";
    return render();
  }
  if (file.size > 8 * 1024 * 1024) {
    state.importError = "That image is over 8MB. Take a tighter screenshot.";
    return render();
  }

  state.importBusy = true; state.importError = null; state.importRows = null;
  state.importLocal = false; state.importStage = ""; render();

  try {
    const b64 = await new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => res(String(fr.result).split(",")[1]);
      fr.onerror = rej;
      fr.readAsDataURL(file);
    });

    // The demo build has no backend of its own, so it hands back a canned
    // answer instead of leaving you staring at a network error. It is NOT
    // reading your picture — the drop zone says so.
    if (DEMO_MODE) {
      await new Promise(r => setTimeout(r, 900));
      state.importBusy = false;
      // the only drop zone left is the lead table on Pipeline
      state.importRows = DEMO_ROWS.map(r => ({ ...r }));
      return render();
    }

    const { data: { session } } = await sb.auth.getSession();

    let res;
    try {
      res = await fetch(`${SUPABASE_URL}/functions/v1/read-sheet`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": `Bearer ${session?.access_token || SUPABASE_ANON_KEY}`,
        },
        body: JSON.stringify({ image: b64, mime: file.type }),
      });
    } catch {
      // the request never reached anything at all -> read it here instead
      return fallbackToBrowser(file);
    }

    const out = await res.json().catch(() => ({}));
    // Not installed, no key on it yet, or it fell over. Rather than telling the
    // agent to go and type it all in, read the picture in their own browser.
    if (res.status === 404 || res.status >= 500) return fallbackToBrowser(file);
    if (!res.ok) throw new Error(out.error || `The reader returned ${res.status}.`);
    state.importBusy = false;

    // a filled-in intake sheet -> straight into a prefilled client record
    if (out.type === "client" && out.client) return takeClientSheet(out.client, false);

    if (!out.rows || !out.rows.length) throw new Error("Could not find any people in that picture. Try a tighter, straighter shot.");

    state.importRows = out.rows.map(r => ({
      full_name: r.full_name || "", phone: r.phone || "",
      date_of_birth: r.date_of_birth || "", city: r.city || "", state: (r.state || "").toUpperCase(),
    }));
    render();
  } catch (err) {
    state.importBusy = false;
    let msg = err.message || "Could not read that screenshot.";
    // the function cannot know who is asking; the manager needs the real instruction, not "ask your manager"
    if (/not switched on yet/i.test(msg) && state.profile && state.profile.role === "admin") {
      msg = "Photo reading needs an Anthropic API key before it will work. "
          + "Get one at console.anthropic.com, then in Supabase go to Edge Functions \u2192 Secrets "
          + "and add ANTHROPIC_API_KEY. Nothing else to change \u2014 it starts working straight away.";
    }
    state.importError = msg;
    render();
  }
}

/* A read intake sheet lands in the normal New Client form with everything
   filled in, so the agent checks it the same way they check anything else. */
function takeClientSheet(c, isDemo) {
  state.openClient = {
    ...blankClient(),
    ...c,
    coverage_amount: c.coverage_amount ?? null,
    monthly_premium: c.monthly_premium ?? null,
    term_years:      c.term_years ?? null,
    sale_date:       todayISO(),
  };
  state.activities = [];
  state.importRows = null;
  state.view = "today";
  state.sheetRead = true;
  render();
  flash(isDemo
    ? "Demo: this is a sample sheet, not your picture. The real reader fills this in from what you actually uploaded."
    : "Read off the sheet. Check every field — especially the phone number and the dates — then save.");
}

async function saveImport() {
  const rows = (state.importRows || []).filter(r => (r.full_name || "").trim());
  if (!rows.length) return;
  state.busy = true; render();
  try {
    const { data: batch, error: bErr } = await sb.from("lead_batches")
      .insert({ agent_id: state.profile.id, source: "screenshot", row_count: rows.length })
      .select().single();
    if (bErr) throw bErr;

    const { error } = await sb.from("leads").insert(rows.map(r => ({
      agent_id: state.profile.id,
      batch_id: batch.id,
      full_name: r.full_name.trim(),
      phone: r.phone || "",
      date_of_birth: r.date_of_birth || null,
      city: r.city || "",
      state: (r.state || "").toUpperCase(),
      source: "screenshot",
      status: "new",
    })));
    if (error) throw error;

    state.busy = false;
    state.importRows = null; state.importLocal = false;
    await refresh();
    flash(`${rows.length} lead${rows.length===1?"":"s"} added. Set a callback on one and it sorts to the top of the sheet.`);
  } catch (err) {
    state.busy = false;
    flash(err.message || "Could not save those leads.", "bad");
  }
}

function exportLeadsCSV() {
  const cols = ["full_name","phone","email","date_of_birth","city","state","source",
                "status","callback_at","call_count","last_called_at","notes"];
  const q = v => `"${String(v ?? "").replace(/"/g,'""')}"`;
  const csv = [cols.join(",")].concat(state.leads.map(l => cols.map(k => q(l[k])).join(","))).join("\r\n");
  const url = URL.createObjectURL(new Blob(["﻿"+csv], { type:"text/csv;charset=utf-8" }));
  const a = document.createElement("a");
  a.href = url; a.download = `leads-${todayISO()}.csv`; a.click();
  URL.revokeObjectURL(url);
}

/* ---------- CSV ---------- */
function exportCSV() {
  const cols = ["full_name","date_of_birth","phone","email","street","city","state","zip",
                "height","weight","ssn_last4","beneficiary","beneficiary_phone",
                "beneficiary2","beneficiary2_phone",
                "sale_date","policy_start_date","carrier","policy_number",
                "coverage_amount","term_years","monthly_premium","draft_day","health_notes","notes"];
  const q = v => `"${String(v ?? "").replace(/"/g,'""')}"`;
  // export what the Book tab is currently showing
  const list = state.bookState === "all" ? state.clients
             : state.clients.filter(c => bookState(c).key === state.bookState);
  const onlySold = false;
  const csv = [cols.join(",")].concat(list.map(c => cols.map(k => q(c[k])).join(","))).join("\r\n");
  const url = URL.createObjectURL(new Blob(["﻿"+csv], { type:"text/csv;charset=utf-8" }));
  const a = document.createElement("a");
  a.href = url; a.download = `${onlySold ? "sold" : "clients"}-${todayISO()}.csv`; a.click();
  URL.revokeObjectURL(url);
}

/* ============================================================
   7. SESSION
   ============================================================ */
async function refresh() {
  try { await loadAll(); } catch (err) { return flash(err.message || "Could not load data.", "bad"); }
  render();
}

async function bootSession() {
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) { state.profile = null; state.busy = false; return render(); }

  const { data:prof, error } = await sb.from("profiles").select("*").eq("id", session.user.id).single();
  if (error || !prof) {
    state.profile = null; state.busy = false;
    return flash("Signed in, but no profile was found. Ask your manager to check the setup.", "bad");
  }
  state.profile = prof;
  state.busy = false;
  if (prof.status === "active") { try { await loadAll(); } catch(e){ /* shown on render */ } }
  render();
}

/* ---------- turn an email link into a signed-in session ----------
   This client is created with detectSessionInUrl:false, so nothing picks the
   tokens out of the address bar on its own. We do it here, then wipe the
   address so a copied URL can never hand someone else a live session. */
async function consumeAuthLink() {
  if (!AUTH_LINK.type && !AUTH_LINK.error && !AUTH_LINK.access_token) return false;

  const cleanUrl = () => {
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  };

  if (AUTH_LINK.error) {
    cleanUrl();
    const expired = /expired|invalid/i.test(AUTH_LINK.error + " " + AUTH_LINK.errorText);
    state.authMode = null;
    state.msg = { kind: "bad", text: expired
      ? "That link has expired. Sign in, or create the account again to get a fresh one."
      : (AUTH_LINK.errorText || "That link did not work.") };
    return true;
  }

  if (AUTH_LINK.access_token && AUTH_LINK.refresh_token) {
    const { error } = await sb.auth.setSession({
      access_token: AUTH_LINK.access_token,
      refresh_token: AUTH_LINK.refresh_token,
    });
    cleanUrl();
    if (error) {
      state.msg = { kind: "bad", text: error.message || "That link did not work." };
      return true;
    }
    // A recovery or invite link means they still have to choose a password.
    if (AUTH_LINK.type === "recovery" || AUTH_LINK.type === "invite") {
      state.authMode = "set-password";
      render();
      return true;
    }
    if (AUTH_LINK.type === "signup") state.msg = { kind: "good", text: "Email confirmed." };
    return false;
  }
  cleanUrl();
  return false;
}

if (CONFIGURED) {
  sb.auth.onAuthStateChange((event) => {
    if (event === "SIGNED_OUT") { state.profile = null; render(); }
  });
  (async () => {
    const stop = await consumeAuthLink();
    if (stop) return render();
    await bootSession();
  })();
} else {
  render();
}

window.__ledger = { todayISO, isoPlus, daysBetween, parseISO, relDay, age, ordinal, money, esc, CONFIGURED };
