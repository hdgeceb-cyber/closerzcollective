<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="theme-color" content="#04070D" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Closers Collective — CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,75,700..900;1,75,700..900&family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   CLOSERS COLLECTIVE — design system
   black field, electric blue, heavy condensed italic display.
   ============================================================ */
:root{
  --void:#04070D;
  --deep:#070B14;
  --panel:#0C1220;
  --panel-2:#111A2B;
  --line:#1B2740;
  --line-hot:#25406B;
  --txt:#EAF1FC;
  --txt-2:#93A3BC;
  --txt-3:#5F708C;
  --blue:#2E8BFF;
  --blue-hot:#57A5FF;
  --blue-deep:#0E4FA8;
  --blue-wash:rgba(46,139,255,.10);
  --blue-line:rgba(46,139,255,.32);
  --glow:0 0 22px rgba(46,139,255,.30);
  --red:#FF4D4D;
  --red-wash:rgba(255,77,77,.09);
  --red-line:rgba(255,77,77,.30);
  --gold:#FFC24D;
  --gold-wash:rgba(255,194,77,.09);
  --gold-line:rgba(255,194,77,.30);
  --green:#2BD98A;

  /* one colour per kind of call — see kindKey() */
  --k-pre:#FF3B30;    --k-pre-w:rgba(255,59,48,.13);    --k-pre-l:rgba(255,59,48,.34);
  --k-post:#34C759;   --k-post-w:rgba(52,199,89,.12);   --k-post-l:rgba(52,199,89,.32);
  --k-m3:#4C8DFF;     --k-m3-w:rgba(76,141,255,.13);    --k-m3-l:rgba(76,141,255,.34);
  --k-m6:#14B8C4;     --k-m6-w:rgba(20,184,196,.13);    --k-m6-l:rgba(20,184,196,.34);
  --k-m9:#A855F7;     --k-m9-w:rgba(168,85,247,.14);    --k-m9-l:rgba(168,85,247,.36);
  --k-m12:#F5A524;    --k-m12-w:rgba(245,165,36,.13);   --k-m12-l:rgba(245,165,36,.34);
  --k-bday:#FF5CA8;   --k-bday-w:rgba(255,92,168,.13);  --k-bday-l:rgba(255,92,168,.34);
  --k-follow:#8A94A6; --k-follow-w:rgba(138,148,166,.12);--k-follow-l:rgba(138,148,166,.30);

  --radius:4px;
  --disp:"Archivo","Arial Narrow",sans-serif;
  --sans:"Inter Tight",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--void)}
body{
  font-family:var(--sans);
  background:var(--void);
  color:var(--txt);
  font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-feature-settings:"tnum" 1;
  background-image:
    radial-gradient(900px 520px at 12% -8%, rgba(46,139,255,.16), transparent 62%),
    radial-gradient(700px 460px at 92% 4%, rgba(14,79,168,.14), transparent 60%);
  background-attachment:fixed;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
::selection{background:rgba(46,139,255,.32)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:var(--deep)}
::-webkit-scrollbar-thumb{background:#1B2740;border-radius:6px;border:3px solid var(--deep)}
::-webkit-scrollbar-thumb:hover{background:#2A3B5E}

/* ---------- type ---------- */
.display{
  font-family:var(--disp);font-weight:900;font-style:italic;font-stretch:78%;
  text-transform:uppercase;letter-spacing:-.005em;line-height:.94;
  text-shadow:0 0 30px rgba(46,139,255,.28);
}
.eyebrow{
  font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--txt-3);
}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ---------- controls ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:38px;padding:0 16px;border:1px solid var(--line-hot);border-radius:var(--radius);
  background:var(--panel-2);color:var(--txt);
  font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  cursor:pointer;white-space:nowrap;text-decoration:none;
  transition:background .15s ease,border-color .15s ease,box-shadow .15s ease,transform .06s ease,color .15s ease;
}
.btn:hover{background:#16233A;border-color:var(--blue);box-shadow:0 0 16px rgba(46,139,255,.22)}
.btn:active{transform:translateY(1px)}
.btn.green{
  background:linear-gradient(180deg,var(--blue),#1567D4);
  border-color:var(--blue-hot);color:#fff;box-shadow:var(--glow);
}
.btn.green:hover{background:linear-gradient(180deg,var(--blue-hot),#2E8BFF);box-shadow:0 0 28px rgba(46,139,255,.5)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.ghost:hover{background:var(--panel-2);border-color:var(--line-hot);box-shadow:none}
.btn.quiet{background:transparent;border-color:transparent;color:var(--txt-2);padding:0 9px}
.btn.quiet:hover{background:rgba(46,139,255,.10);color:var(--txt);box-shadow:none}
.btn.danger{background:transparent;color:var(--red);border-color:var(--red-line)}
.btn.danger:hover{background:var(--red-wash);border-color:var(--red);box-shadow:0 0 14px rgba(255,77,77,.2)}
.btn.sm{height:31px;padding:0 11px;font-size:11px}
.btn.full{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}

.field{display:block;margin-bottom:14px}
.field > span{
  display:block;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--txt-3);margin-bottom:6px;
}
.input,select.input,textarea.input{
  width:100%;height:40px;padding:0 12px;background:var(--void);color:var(--txt);
  border:1px solid var(--line);border-radius:var(--radius);font-size:14.5px;
  transition:border-color .15s ease,box-shadow .15s ease,background .15s ease;
}
textarea.input{height:auto;min-height:84px;padding:10px 12px;line-height:1.5;resize:vertical}
select.input{
  appearance:none;padding-right:32px;background-repeat:no-repeat;background-position:right 12px center;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' fill='none' stroke='%232E8BFF' stroke-width='1.6'/></svg>");
}
.input::placeholder{color:var(--txt-3)}
.input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(46,139,255,.16),0 0 18px rgba(46,139,255,.15);background:#060A12}
input[type=date].input::-webkit-calendar-picker-indicator{filter:invert(58%) sepia(78%) saturate(2400%) hue-rotate(197deg) brightness(103%)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}

/* ---------- chrome ---------- */
.shell{display:flex;min-height:100vh}
.rail{
  width:224px;flex:0 0 224px;border-right:1px solid var(--line);
  background:linear-gradient(180deg,rgba(12,18,32,.92),rgba(4,7,13,.92));
  backdrop-filter:blur(8px);
  padding:20px 0 0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
}
.brand{padding:0 18px 18px;border-bottom:1px solid var(--line);margin-bottom:8px;display:flex;gap:11px;align-items:center}
.brand .mark{width:38px;height:38px;flex:0 0 38px;filter:drop-shadow(0 0 10px rgba(46,139,255,.5))}
.brand h1{
  font-family:var(--disp);font-weight:900;font-style:italic;font-stretch:78%;text-transform:uppercase;
  font-size:18px;line-height:.98;letter-spacing:-.01em;
}
.nav{padding:8px 10px;flex:1}
.nav a{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:10px 12px;border-radius:var(--radius);text-decoration:none;
  font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--txt-2);margin-bottom:2px;cursor:pointer;border:1px solid transparent;
  transition:background .14s ease,color .14s ease,border-color .14s ease;
}
.nav a:hover{background:rgba(46,139,255,.08);color:var(--txt);border-color:var(--line)}
.nav a.on{
  background:linear-gradient(90deg,rgba(46,139,255,.20),rgba(46,139,255,.05));
  color:#fff;border-color:var(--blue-line);box-shadow:inset 2px 0 0 var(--blue);
}
.pip{
  min-width:20px;height:19px;padding:0 6px;border-radius:10px;
  background:var(--red);color:#fff;font-size:11px;font-weight:800;
  display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;
  box-shadow:0 0 12px rgba(255,77,77,.5);
}
.pip.calm{background:var(--line-hot);color:var(--txt);box-shadow:none}
.whoami{padding:14px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--txt-3);
  letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.whoami strong{display:block;color:var(--txt);font-size:14px;font-weight:600;margin-bottom:2px;
  letter-spacing:0;text-transform:none}

.main{flex:1;min-width:0;padding:34px 40px 120px;max-width:1220px}
.page-head{margin-bottom:26px}
.page-head h2{font-size:52px}
.page-head .sub{color:var(--txt-2);margin-top:10px;font-size:14.5px}

/* ---------- cards ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.section{margin-bottom:34px}
.section-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-bottom:12px;padding-bottom:9px;border-bottom:1px solid var(--line);
}
.section-head h3{font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--txt-2)}
.section-head .count{
  font-size:11px;color:var(--txt-3);font-variant-numeric:tabular-nums;font-weight:700;
  border:1px solid var(--line);border-radius:10px;padding:1px 9px;
}

/* ---------- call row ---------- */
.call{
  display:flex;align-items:flex-start;gap:14px;padding:15px 17px;
  background:linear-gradient(180deg,var(--panel),var(--deep));
  border:1px solid var(--line);border-radius:var(--radius);margin-bottom:8px;
  border-left:3px solid var(--line-hot);position:relative;overflow:hidden;
  transition:border-color .16s ease,box-shadow .16s ease,transform .1s ease;
}
.call:hover{border-color:var(--line-hot);box-shadow:0 0 0 1px rgba(46,139,255,.10),0 10px 30px -18px #000;transform:translateY(-1px)}

/* the left edge and the wash say WHAT KIND of call this is */
.call.k-pre   {border-left-color:var(--k-pre);   background:linear-gradient(100deg,var(--k-pre-w),var(--deep) 46%)}
.call.k-post  {border-left-color:var(--k-post);  background:linear-gradient(100deg,var(--k-post-w),var(--deep) 46%)}
.call.k-m3    {border-left-color:var(--k-m3);    background:linear-gradient(100deg,var(--k-m3-w),var(--deep) 46%)}
.call.k-m6    {border-left-color:var(--k-m6);    background:linear-gradient(100deg,var(--k-m6-w),var(--deep) 46%)}
.call.k-m9    {border-left-color:var(--k-m9);    background:linear-gradient(100deg,var(--k-m9-w),var(--deep) 46%)}
.call.k-m12   {border-left-color:var(--k-m12);   background:linear-gradient(100deg,var(--k-m12-w),var(--deep) 46%)}
.call.k-bday  {border-left-color:var(--k-bday);  background:linear-gradient(100deg,var(--k-bday-w),var(--deep) 46%)}
.call.k-follow{border-left-color:var(--k-follow);background:linear-gradient(100deg,var(--k-follow-w),var(--deep) 46%)}
/* overdue is a ring, not a colour — the colour is already saying what the call is */
.call.od{box-shadow:inset 0 0 0 1px rgba(255,77,77,.30)}
.call-body{flex:1;min-width:0}
.call-name{font-size:17px;font-weight:700;letter-spacing:-.01em;margin-bottom:4px;color:#fff}
.call-name a{text-decoration:none;border-bottom:1px solid transparent}
.call-name a:hover{border-bottom-color:var(--blue);color:var(--blue-hot)}
.call-meta{font-size:13px;color:var(--txt-2);display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.call-note{font-size:13.5px;color:var(--txt-2);margin-top:7px;line-height:1.5;max-width:66ch}
.hint{font-size:13px;color:var(--txt-2);line-height:1.6;margin:-4px 0 14px;padding:11px 13px;
  background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--k-pre);border-radius:var(--radius)}
.hint strong{color:var(--txt)}
.call-acts{display:flex;gap:6px;align-items:center;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}

.tag{
  display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:2px;
  font-size:9.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;
  background:var(--panel-2);color:var(--txt-2);border:1px solid var(--line);
}
.tag.late{background:var(--red-wash);color:var(--red);border-color:var(--red-line)}
.tag.plain{background:transparent;color:var(--txt-3)}
.tag.k-pre   {background:var(--k-pre-w);   color:var(--k-pre);   border-color:var(--k-pre-l)}
.tag.k-post  {background:var(--k-post-w);  color:var(--k-post);  border-color:var(--k-post-l)}
.tag.k-m3    {background:var(--k-m3-w);    color:var(--k-m3);    border-color:var(--k-m3-l)}
.tag.k-m6    {background:var(--k-m6-w);    color:var(--k-m6);    border-color:var(--k-m6-l)}
.tag.k-m9    {background:var(--k-m9-w);    color:#C58BFF;        border-color:var(--k-m9-l)}
.tag.k-m12   {background:var(--k-m12-w);   color:var(--k-m12);   border-color:var(--k-m12-l)}
.tag.k-bday  {background:var(--k-bday-w);  color:var(--k-bday);  border-color:var(--k-bday-l)}
.tag.k-follow{background:var(--k-follow-w);color:#A7B2C4;        border-color:var(--k-follow-l)}
.tag.tries{background:var(--red-wash);color:var(--red);border-color:var(--red-line)}

/* ---------- the book: one row per client, stripe says how they are doing ---------- */
.bookrow{
  display:flex;align-items:flex-start;gap:14px;padding:14px 17px;
  background:linear-gradient(180deg,var(--panel),var(--deep));
  border:1px solid var(--line);border-radius:var(--radius);margin-bottom:8px;
  border-left:3px solid var(--line-hot);cursor:pointer;
  transition:border-color .16s ease,box-shadow .16s ease,transform .1s ease;
}
.bookrow:hover{border-color:var(--line-hot);box-shadow:0 0 0 1px rgba(46,139,255,.10),0 10px 30px -18px #000;transform:translateY(-1px)}
.bookrow.st-late   {border-left-color:var(--red);   background:linear-gradient(100deg,rgba(255,77,77,.10),var(--deep) 46%)}
.bookrow.st-today  {border-left-color:var(--gold);  background:linear-gradient(100deg,rgba(255,194,77,.10),var(--deep) 46%)}
.bookrow.st-soon   {border-left-color:var(--blue);  background:linear-gradient(100deg,rgba(46,139,255,.10),var(--deep) 46%)}
.bookrow.st-current{border-left-color:var(--green); background:linear-gradient(100deg,rgba(43,217,138,.08),var(--deep) 46%)}
.bookrow.st-none   {border-left-color:var(--txt-3)}
.bookrow .bk-body{flex:1;min-width:0}
.bookrow .bk-name{font-size:16.5px;font-weight:700;letter-spacing:-.01em;color:#fff;margin-bottom:4px}
.bookrow .bk-meta{font-size:13px;color:var(--txt-2);display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.bookrow .bk-sub{font-size:13px;color:var(--txt-3);margin-top:6px}
.bookrow .bk-right{flex-shrink:0;text-align:right}
.bookrow .bk-prem{font-family:var(--disp);font-style:italic;font-weight:800;font-size:19px;color:#fff;letter-spacing:-.01em}
.bookrow .bk-prem span{font-family:var(--sans);font-style:normal;font-weight:600;font-size:11px;color:var(--txt-3)}

.tag.st-late   {background:var(--red-wash);color:var(--red);border-color:var(--red-line)}
.tag.st-today  {background:var(--gold-wash);color:var(--gold);border-color:var(--gold-line)}
.tag.st-soon   {background:var(--blue-wash);color:var(--blue-hot);border-color:var(--blue-line)}
.tag.st-current{background:rgba(43,217,138,.10);color:var(--green);border-color:rgba(43,217,138,.30)}
.tag.st-none   {background:transparent;color:var(--txt-3)}
@media(max-width:720px){.bookrow{flex-direction:column;gap:10px}.bookrow .bk-right{text-align:left}}

/* the numbers strip */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:0 0 26px;
  border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--panel)}
.tile{padding:16px 20px;border-right:1px solid var(--line)}
.tile:last-child{border-right:0}
.tile .n{font-family:var(--disp);font-style:italic;font-weight:800;font-size:34px;line-height:1;
  letter-spacing:-.02em;color:#fff}
.tile .n.red{color:var(--red)}
.tile .l{margin-top:7px;font-size:9.5px;font-weight:800;letter-spacing:.13em;
  text-transform:uppercase;color:var(--txt-3)}
@media(max-width:820px){.tiles{grid-template-columns:repeat(2,1fr)}
  .tile:nth-child(2){border-right:0}.tile:nth-child(1),.tile:nth-child(2){border-bottom:1px solid var(--line)}}

/* the key under the banner */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin:-14px 0 24px 2px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--txt-3)}
.legend i{width:9px;height:9px;border-radius:2px;display:block}

/* ---------- the banner ---------- */
.banner{
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding:16px 20px;margin-bottom:26px;border-radius:var(--radius);
  border:1px solid var(--blue-line);border-left:3px solid var(--blue);
  background:linear-gradient(100deg,rgba(46,139,255,.16),rgba(12,18,32,.6) 60%);
}
.banner.hot{border-color:var(--red-line);border-left-color:var(--red);
  background:linear-gradient(100deg,rgba(255,77,77,.15),rgba(12,18,32,.6) 60%)}
.banner .bignum{
  font-family:var(--disp);font-weight:900;font-style:italic;font-stretch:78%;
  font-size:44px;line-height:.9;color:#fff;text-shadow:0 0 26px rgba(46,139,255,.45);
}
.banner.hot .bignum{text-shadow:0 0 26px rgba(255,77,77,.5)}
.banner .btext{flex:1;min-width:200px}
.banner .bhead{font-size:15px;font-weight:700;color:#fff;letter-spacing:-.01em}
.banner .bsub{font-size:13px;color:var(--txt-2);margin-top:3px;line-height:1.5}
@media (max-width:760px){ .banner{gap:12px;padding:14px 15px} .banner .bignum{font-size:34px} }

/* ---------- stat strip ---------- */
.stats{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:var(--radius);
  margin-bottom:32px;overflow:hidden;
}
.stat{padding:18px 20px;background:linear-gradient(180deg,var(--panel),var(--deep));position:relative}
.stat .v{
  font-family:var(--disp);font-weight:900;font-style:italic;font-stretch:78%;
  font-size:40px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:#fff;
  text-shadow:0 0 26px rgba(46,139,255,.35);
}
.stat .v.alert{color:var(--red);text-shadow:0 0 26px rgba(255,77,77,.4)}
.stat .k{margin-top:9px}

/* ---------- table ---------- */
.table-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{
  text-align:left;padding:11px 15px;font-size:9.5px;font-weight:800;letter-spacing:.18em;
  text-transform:uppercase;color:var(--txt-3);border-bottom:1px solid var(--line);
  white-space:nowrap;background:var(--deep);position:sticky;top:0;z-index:1;
}
td{padding:13px 15px;border-bottom:1px solid rgba(27,39,64,.6);vertical-align:middle;color:var(--txt-2)}
td strong{color:#fff;font-weight:600}
tbody tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer;transition:background .12s ease}
tbody tr:hover{background:rgba(46,139,255,.06)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- stage chip ---------- */
.stage{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;white-space:nowrap;
  letter-spacing:.04em;text-transform:uppercase;color:var(--txt-2)}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.s-new{background:#6B7C99;box-shadow:0 0 8px #6B7C99}
.s-contacted{background:#4C9BF5;box-shadow:0 0 8px #4C9BF5}
.s-quoted{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.s-sold{background:var(--green);box-shadow:0 0 10px var(--green)}
.s-issued{background:#12E39A;box-shadow:0 0 12px #12E39A}
.s-not_interested{background:#3A4762}
.s-lost{background:var(--red);box-shadow:0 0 8px var(--red)}

/* ---------- modal ---------- */
.veil{position:fixed;inset:0;background:rgba(2,4,8,.78);backdrop-filter:blur(4px);z-index:60;
  display:flex;align-items:flex-start;justify-content:center;padding:40px 18px;overflow:auto}
.modal{
  background:var(--deep);border:1px solid var(--line-hot);border-radius:var(--radius);
  width:100%;max-width:680px;animation:rise .18s ease;
  box-shadow:0 0 60px rgba(46,139,255,.14),0 40px 90px -30px #000;
}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.modal-head{
  padding:20px 24px 16px;border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:flex-start;gap:14px;
  background:linear-gradient(180deg,rgba(46,139,255,.07),transparent);
}
.modal-head h3{
  font-family:var(--disp);font-weight:900;font-style:italic;font-stretch:78%;text-transform:uppercase;
  font-size:29px;line-height:1;letter-spacing:-.01em;color:#fff;text-shadow:0 0 24px rgba(46,139,255,.3);
}
.modal-head .sub{font-size:11px;color:var(--txt-3);margin-top:7px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.modal-body{padding:20px 24px}
.modal-foot{padding:15px 24px;border-top:1px solid var(--line);display:flex;gap:9px;
  justify-content:flex-end;background:var(--void);flex-wrap:wrap}
.x{background:none;border:none;font-size:22px;line-height:1;color:var(--txt-3);cursor:pointer;
  padding:2px 7px;border-radius:2px}
.x:hover{background:rgba(46,139,255,.12);color:var(--txt)}

.quickbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:13px 24px;
  background:var(--void);border-bottom:1px solid var(--line)}
.lastnote{
  padding:14px 16px;background:var(--gold-wash);border:1px solid var(--gold-line);
  border-left:3px solid var(--gold);border-radius:var(--radius);
  font-size:14px;line-height:1.55;margin-bottom:22px;color:#F0DCA8;
}
.lastnote .eyebrow{display:block;margin-bottom:5px;color:var(--gold)}
.fieldset{border:none;margin-bottom:22px}
.ssn-note{
  font-size:12.5px;line-height:1.55;color:#F0DCA8;margin:-4px 0 4px;
  padding:11px 13px;border:1px solid var(--gold-line);border-left:3px solid var(--gold);
  border-radius:var(--radius);background:var(--gold-wash);
}
.fieldset legend{
  font-size:10px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--blue);
  margin-bottom:13px;width:100%;padding-bottom:8px;border-bottom:1px solid var(--line);
}

/* ---------- auth ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
.auth-art{
  background:
    radial-gradient(700px 500px at 20% 20%, rgba(46,139,255,.20), transparent 62%),
    linear-gradient(160deg,#081120,#04070D 70%);
  color:#fff;padding:52px 54px;display:flex;flex-direction:column;justify-content:space-between;
  position:relative;overflow:hidden;border-right:1px solid var(--line);
}
.auth-art:before{
  content:"";position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(rgba(46,139,255,.055) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(46,139,255,.055) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(circle at 30% 40%,#000,transparent 78%);
  -webkit-mask-image:radial-gradient(circle at 30% 40%,#000,transparent 78%);
}
.auth-brand{display:flex;align-items:center;gap:15px;position:relative;z-index:1}
.auth-brand .mark{width:60px;height:60px;flex:0 0 60px;filter:drop-shadow(0 0 18px rgba(46,139,255,.65))}
.auth-art h1{
  font-family:var(--disp);font-weight:900;font-style:italic;font-stretch:78%;text-transform:uppercase;
  font-size:34px;line-height:.92;letter-spacing:-.015em;
}
.auth-art .lede{
  font-family:var(--disp);font-weight:900;font-style:italic;font-stretch:78%;text-transform:uppercase;
  font-size:46px;line-height:.96;letter-spacing:-.015em;max-width:13ch;
  position:relative;z-index:1;text-shadow:0 0 40px rgba(46,139,255,.4);
}
.auth-art .foot{font-size:12.5px;color:var(--txt-3);position:relative;z-index:1;line-height:1.65}
.auth-form{display:flex;align-items:center;justify-content:center;padding:40px 30px;background:var(--void)}
.auth-inner{width:100%;max-width:380px}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:26px}
.tabs button{
  background:none;border:none;padding:10px 0;margin-right:26px;font-size:11px;font-weight:800;
  letter-spacing:.16em;text-transform:uppercase;color:var(--txt-3);cursor:pointer;
  border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tabs button.on{color:var(--blue);border-bottom-color:var(--blue)}

.notice{padding:12px 14px;border-radius:var(--radius);font-size:13.5px;line-height:1.5;
  margin-bottom:16px;border:1px solid;border-left-width:3px}
.notice.bad{background:var(--red-wash);border-color:var(--red-line);border-left-color:var(--red);color:#FFB3B3}
.notice.good{background:var(--blue-wash);border-color:var(--blue-line);border-left-color:var(--blue);color:#B6D7FF}
.notice.warn{background:var(--gold-wash);border-color:var(--gold-line);border-left-color:var(--gold);color:#F0DCA8}

.empty{padding:50px 20px;text-align:center;color:var(--txt-3);border:1px dashed var(--line-hot);
  border-radius:var(--radius);background:linear-gradient(180deg,var(--panel),transparent)}
.empty .big{
  font-family:var(--disp);font-weight:900;font-style:italic;font-stretch:78%;text-transform:uppercase;
  font-size:26px;color:var(--txt-2);margin-bottom:8px;
}

.timeline{position:relative;padding-left:20px}
.timeline:before{content:"";position:absolute;left:4px;top:5px;bottom:5px;width:1px;background:var(--line)}
.tl-item{position:relative;padding-bottom:17px}
.tl-item:before{content:"";position:absolute;left:-20px;top:6px;width:9px;height:9px;border-radius:50%;
  background:var(--void);border:1.5px solid var(--line-hot)}
.tl-item.call:before{border-color:var(--blue);background:var(--blue);box-shadow:0 0 10px var(--blue)}
.tl-when{font-size:10px;color:var(--txt-3);letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.tl-body{font-size:14px;margin-top:3px;line-height:1.5;color:var(--txt-2)}

.toolbar{display:flex;gap:9px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.toolbar .input{height:36px;width:auto;min-width:220px}
.spacer{flex:1}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  height:30px;padding:0 13px;border:1px solid var(--line);background:var(--panel);border-radius:15px;
  font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--txt-2);
  cursor:pointer;display:inline-flex;align-items:center;transition:all .14s ease;
}
.chip:hover{border-color:var(--line-hot);color:var(--txt)}
.chip.on{background:linear-gradient(180deg,var(--blue),#1567D4);color:#fff;border-color:var(--blue-hot);
  box-shadow:0 0 16px rgba(46,139,255,.35)}

.dropzone{
  border:1.5px dashed var(--line-hot);border-radius:var(--radius);padding:22px 24px;text-align:center;
  background:linear-gradient(180deg,rgba(46,139,255,.06),transparent);margin-bottom:26px;cursor:pointer;
  transition:border-color .16s ease,background .16s ease;
}
.dropzone:hover,.dropzone.over{border-color:var(--blue);background:linear-gradient(180deg,rgba(46,139,255,.13),transparent)}
.dropzone.busy{cursor:progress;border-style:solid;border-color:var(--blue)}
.dropzone.slim{padding:15px 20px;margin-bottom:22px}
.dropzone.slim .dz-title{font-size:16px}
.dropzone.slim .dz-sub{margin:5px auto 11px;font-size:12.5px}
.dz-title{font-family:var(--disp);font-weight:900;font-style:italic;font-stretch:78%;text-transform:uppercase;
  font-size:20px;color:#fff;letter-spacing:-.01em}
.dz-sub{font-size:13px;color:var(--txt-2);margin:7px auto 14px;max-width:60ch;line-height:1.5}
.pastebox{border:1.5px solid var(--line-hot);border-radius:var(--radius);padding:20px 22px;margin-bottom:26px;
  background:linear-gradient(180deg,rgba(46,139,255,.06),transparent)}
.pastebox textarea.input{min-height:132px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;
  white-space:pre;overflow-wrap:normal;overflow-x:auto}
.pastebox .prow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:12px}
.pastebox .phint{font-size:12.5px;color:var(--txt-3)}
.pastebox .phint a{color:var(--txt-2);text-decoration:underline;cursor:pointer}
.pastebox .phint a:hover{color:var(--blue)}
/* ---- Training tab: the practice trainer ---- */
.rep-turn{margin:0 0 16px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.rep-turn:last-child{border-bottom:none;padding-bottom:0;margin-bottom:0}
.rep-them{background:#191d27;border-left:3px solid var(--gold,#f5a524);border-radius:0 10px 10px 0;padding:11px 14px}
.rep-lbl{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gold,#f5a524);margin-bottom:3px}
.rep-say{font-size:16px;color:#f2e6cf}
.rep-ta{min-height:60px;margin-top:9px}
.rep-coach{margin-top:10px;padding:11px 14px;border:1px dashed var(--line-hot);border-radius:10px;background:#10141c}
.rep-lbl2{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-hot,#57a2ff)}
.rep-model{color:#dbe6fb;font-size:14.5px;line-height:1.55;margin-top:5px}
.rep-why{color:var(--txt-3);font-size:12.5px;margin-top:7px}
.rep-dim{display:flex;align-items:center;gap:12px;margin:9px 0}
.rep-dim label{flex:1;font-size:14px}
.rep-dim input[type=range]{flex:1;accent-color:var(--blue)}
.rep-val{width:30px;text-align:right;font-weight:800;color:var(--blue-hot,#57a2ff)}
/* the voice call overlay */
.vc-veil{position:fixed;inset:0;z-index:200;background:rgba(6,8,12,.8);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:18px}
.vc-phone{width:100%;max-width:460px;background:linear-gradient(180deg,#141926,#0d1017);border:1px solid var(--line-hot);border-radius:22px;padding:26px 22px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.vc-top{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.vc-avatar{width:56px;height:56px;border-radius:50%;background:radial-gradient(120% 120% at 30% 20%,#2e8bff,#0f4bb0);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:24px;color:#fff}
.vc-name{font-weight:800;font-size:19px}
.vc-sub{color:var(--txt-3);font-size:13px}
.vc-status{font-size:14px;font-weight:700;letter-spacing:.02em;color:var(--txt-2);padding:10px 0;min-height:22px}
.vc-status.them{color:var(--gold,#f5a524)} .vc-status.you{color:var(--blue-hot,#57a2ff)} .vc-status.live{color:var(--green,#34c759)}
.vc-cap{min-height:60px;background:#0d1017;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15.5px;line-height:1.5}
.vc-them{color:#f2e6cf}
.vc-youline{min-height:20px;color:var(--blue-hot,#57a2ff);font-size:14px;margin:10px 2px 0;font-style:italic}
.vc-hint{color:#dbe6fb;font-size:13.5px;margin:8px 2px 0;line-height:1.5}
.vc-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}
.vc-done{flex:1;min-width:150px}
.dz-bar{height:3px;width:220px;margin:0 auto;background:var(--line);border-radius:2px;overflow:hidden}
.dz-bar span{display:block;height:100%;width:40%;background:var(--blue);border-radius:2px;
  animation:slide 1.1s ease-in-out infinite;box-shadow:0 0 12px var(--blue)}
@keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(360%)}}
.review-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;
  padding:18px 20px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(46,139,255,.07),transparent)}
.input.sm{height:32px;font-size:13.5px;padding:0 9px;min-width:110px}
.mobilenav{display:none}
.loading{padding:60px;text-align:center;color:var(--txt-3);font-size:11px;
  letter-spacing:.2em;text-transform:uppercase;font-weight:700}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .auth{grid-template-columns:1fr}
  .auth-art{padding:32px 24px;min-height:auto;border-right:none;border-bottom:1px solid var(--line)}
  .auth-art .lede{font-size:32px;margin:22px 0}
  .stats{grid-template-columns:1fr 1fr}
}
@media (max-width:760px){
  .rail{display:none}
  .main{padding:20px 15px 96px}
  .page-head h2{font-size:36px}
  .grid2,.grid3{grid-template-columns:1fr}
  .call{flex-direction:column;gap:11px}
  .call-acts{width:100%;justify-content:flex-start}
  .stat .v{font-size:32px}
  .mobilenav{
    display:flex;position:fixed;bottom:0;left:0;right:0;
    background:rgba(7,11,20,.96);backdrop-filter:blur(12px);
    border-top:1px solid var(--line-hot);z-index:50;padding-bottom:env(safe-area-inset-bottom);
  }
  .mobilenav a{
    flex:1;text-align:center;padding:12px 4px 13px;font-size:10px;font-weight:800;
    letter-spacing:.14em;text-transform:uppercase;color:var(--txt-3);text-decoration:none;
    border-top:2px solid transparent;cursor:pointer;position:relative;
  }
  .mobilenav a.on{color:var(--blue);border-top-color:var(--blue);
    background:linear-gradient(180deg,rgba(46,139,255,.14),transparent)}
  .mobilenav .pip{position:absolute;top:3px;right:50%;margin-right:-28px;transform:scale(.8)}
  .modal{max-width:none;border-left:none;border-right:none}
  .veil{padding:0}
  .modal-foot{position:sticky;bottom:0}
}
</style>

     1. baked into this file (edit the line above), or
     2. a one-time setup link ending in  #k=<your anon key>  — the app
        saves it and cleans the address bar, or

   The anon key is public by design: it is in every copy of this app and
   grants nothing on its own. Every table is locked by row-level security.
   ============================================================ */
const CFG_STORE = "cc_crm_config";
function resolveConfig() {
  let url = SUPABASE_URL_BAKED, key = SUPABASE_ANON_KEY_BAKED;

  const hash = new URLSearchParams((location.hash || "").replace(/^#/, ""));
  const hk = hash.get("k"), hu = hash.get("u");
  if (hk) {
    key = hk;
    if (hu) url = hu;
    try { localStorage.setItem(CFG_STORE, JSON.stringify({ url, key })); } catch (e) {}
    // do not leave the key sitting in the address bar
    history.replaceState(null, "", location.pathname + location.search);
  }

  if (!key) {
    try {
      const saved = JSON.parse(localStorage.getItem(CFG_STORE) || "{}");
      if (saved.key) { key = saved.key; url = saved.url || url; }
    } catch (e) {}
  }
  return { url, key };
}
const { url: SUPABASE_URL, key: SUPABASE_ANON_KEY } = resolveConfig();

/* ---------- what an email link came back with ----------
   Supabase puts the outcome of a confirmation or a password reset in the
   address bar. Read it NOW: supabase-js tidies the address away as soon as
   it starts up, and by the time anything renders it would be gone. */
const AUTH_LINK = (() => {
  const h = new URLSearchParams((location.hash || "").replace(/^#/, ""));
  const q = new URLSearchParams(location.search || "");
  const get = (k) => h.get(k) || q.get(k);
  const desc = get("error_description") || "";
  return {
    type:  get("type") || "",                                  // signup | recovery | invite | magiclink
    access_token:  get("access_token")  || "",
    refresh_token: get("refresh_token") || "",
    error: get("error") || get("error_code") || "",
    errorText: decodeURIComponent(String(desc).replace(/\+/g, " ")),
  };
})();

/* ============================================================
   3. DATE HELPERS  — local time only. Never touch UTC here:
      new Date("2026-09-01") parses as UTC and shifts a day back
      in California. Everything below stays in the browser's own day.
   ============================================================ */
function todayISO(d = new Date()) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function isoPlus(days, from = new Date()) {
  const d = new Date(from.getFullYear(), from.getMonth(), from.getDate() + days);
  return todayISO(d);
}
function parseISO(s) {                       // "2026-09-01" -> local Date
  if (!s) return null;
  const [y,m,d] = s.split("-").map(Number);
  return new Date(y, m-1, d);
}
function daysBetween(iso) {                  // negative = in the past
  const a = parseISO(todayISO()), b = parseISO(iso);
  if (!b) return 0;
  return Math.round((b - a) / 86400000);
}
function prettyDate(iso) {
  const d = parseISO(iso);
  if (!d) return "—";
  return d.toLocaleDateString(undefined, { weekday:"short", month:"short", day:"numeric" });
}
function relDay(iso) {
  const n = daysBetween(iso);
  if (n === 0) return "Today";
  if (n === 1) return "Tomorrow";
  if (n === -1) return "Yesterday";
  if (n < 0) return `${Math.abs(n)} days late`;
  return `in ${n} days`;
}
function prettyStamp(ts) {
  const d = new Date(ts);
  return d.toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
}
function money(n) {
  if (n === null || n === undefined || n === "") return "—";
  return "$" + Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
}
function age(dob) {
  const d = parseISO(dob);
  if (!d) return null;
  const t = new Date();
  let a = t.getFullYear() - d.getFullYear();
  const m = t.getMonth() - d.getMonth();
  if (m < 0 || (m === 0 && t.getDate() < d.getDate())) a--;
  return a;
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function telHref(p){ return "tel:" + String(p||"").replace(/[^\d+]/g,""); }

async function loadAll() {
  const scope = state.profile.role === "admin" ? state.adminScope : "me";

  let cq = sb.from("clients").select("*").order("updated_at",{ascending:false});
  let rq = sb.from("reminders").select("*, clients(id,full_name,phone,sale_date,policy_start_date,carrier,draft_day)")
              .is("done_at", null).order("due_date",{ascending:true});

  if (scope === "me")        { cq = cq.eq("agent_id", state.profile.id); rq = rq.eq("agent_id", state.profile.id); }
  else if (scope !== "all")  { cq = cq.eq("agent_id", scope);            rq = rq.eq("agent_id", scope); }

  let lq = sb.from("leads").select("*").order("callback_at",{ascending:true,nullsFirst:false});
  if (scope === "me")       lq = lq.eq("agent_id", state.profile.id);
  else if (scope !== "all") lq = lq.eq("agent_id", scope);

  const jobs = [cq, rq, lq];
  if (state.profile.role === "admin") {
    jobs.push(sb.from("team_stats").select("*"));
    jobs.push(sb.from("profiles").select("*").order("created_at",{ascending:false}));
  }
  const res = await Promise.all(jobs);
  for (const r of res) if (r.error) throw r.error;

  state.clients   = res[0].data || [];
  state.reminders = res[1].data || [];
  state.leads     = res[2].data || [];
  if (state.profile.role === "admin") {
    state.team    = res[3].data || [];
    state.pending = (res[4].data || []);
  }
}

/* ============================================================
   VOICE CALL — the prospect talks out loud and the agent talks back,
   hands-free, like a real phone call. Uses only what the browser ships
   with: speechSynthesis to speak the prospect's lines, and
   SpeechRecognition to hear the agent. No account, no key, no backend.
   The prospect's lines are the same honest scripted beats — nothing here
   generates a pitch, it just voices the practice.
   ============================================================ */
const VC = { synth: null, recog: null, voices: [], done: false, resolveTurn: null, hangup: false };

function vcVoices() {
  try { VC.voices = (window.speechSynthesis && speechSynthesis.getVoices()) || []; } catch (e) { VC.voices = []; }
  return VC.voices;
}
function vcPickVoice(gender) {
  const vs = vcVoices().filter(v => /^en(-|_|$)/i.test(v.lang || "en"));
  const pool = vs.length ? vs : vcVoices();
  const female = /(samantha|victoria|karen|moira|tessa|susan|zira|fiona|female|woman|google us english)/i;
  const male   = /(daniel|alex|fred|david|male|man|google uk english male)/i;
  const want = gender === "m" ? male : female;
  return pool.find(v => want.test(v.name || "")) || pool.find(v => (gender === "m" ? male : female).test(v.name)) || pool[0] || null;
}
function vcSpeak(text, gender) {
  return new Promise(res => {
    if (!window.speechSynthesis || !window.SpeechSynthesisUtterance) return res();
    let settled = false;
    const finish = () => { if (!settled) { settled = true; res(); } };
    const u = new SpeechSynthesisUtterance(text);
    const v = vcPickVoice(gender); if (v) u.voice = v;
    u.lang = (v && v.lang) || "en-US";
    u.rate = 0.96; u.pitch = gender === "m" ? 0.92 : 1.05;
    u.onend = finish; u.onerror = finish;
    try { speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) { return finish(); }
    setTimeout(finish, Math.min(22000, 1600 + text.length * 85));  // safety net if onend never fires
  });
}
/* Listen for the agent. Resolves when they stop (or tap Done). Falls back to
   Done-only if the browser has no speech recognition (e.g. some Safari builds). */
function vcListen(onInterim) {
  return new Promise(res => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    let settled = false;
    const finish = (text) => { if (!settled) { settled = true; VC.recog = null; VC.resolveTurn = null; res(text || ""); } };
    if (!SR) { VC.resolveTurn = () => finish(""); return; }  // no recognition: Done button ends the turn
    let finalText = "";
    let r; try { r = new SR(); } catch (e) { VC.resolveTurn = () => finish(""); return; }
    r.lang = "en-US"; r.interimResults = true; r.continuous = true; r.maxAlternatives = 1;
    r.onresult = (e) => {
      let interim = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) finalText += t + " "; else interim += t;
      }
      if (onInterim) onInterim((finalText + interim).trim());
    };
    r.onend = () => finish(finalText.trim());
    r.onerror = () => { /* onend follows */ };
    VC.recog = r;
    VC.resolveTurn = () => { try { r.stop(); } catch (e) { finish(finalText.trim()); } };
    try { r.start(); } catch (e) { VC.resolveTurn = () => finish(""); }
  });
}

function vcStatus(txt, cls) {
  const el = document.getElementById("vc-status");
  if (el) { el.textContent = txt; el.className = "vc-status " + (cls || ""); }
}
function vcCaption(who, said) {
  const el = document.getElementById("vc-cap");
  if (!el) return;
  el.innerHTML = `${who ? `<div class="vc-them"><b>${esc(who)}:</b> ${esc(said)}</div>` : ""}`;
}
function vcYou(said) {
  const el = document.getElementById("vc-you");
  if (el) el.textContent = said ? "You: " + said : "";
}

/* Talk to the roleplay edge function. Smart mode makes the prospect actually
   listen and answer. When the key is not in yet it 503s and we fall back to
   the scripted call, so the tool always works. */
function repBrief(p) { return { who: p.who, age: p.age, state: p.state, brief: p.brief }; }
async function roleplayCall(payload) {
  let session = null;
  try { session = (await sb.auth.getSession()).data.session; } catch (e) {}
  const r = await fetch(`${SUPABASE_URL}/functions/v1/roleplay`, {
    method: "POST",
    headers: { "Content-Type": "application/json", "apikey": SUPABASE_ANON_KEY,
      "Authorization": `Bearer ${(session && session.access_token) || SUPABASE_ANON_KEY}` },
    body: JSON.stringify(payload),
  });
  const out = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(out.error || ("roleplay " + r.status));
  return out;
}
async function roleplayOpen(p) {
  try {
    const out = await Promise.race([
      roleplayCall({ mode: "open", persona: repBrief(p) }),
      new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 15000)),
    ]);
    return (out && out.say) ? out.say : null;
  } catch (e) { return null; }
}

/* the prospect actually listens: each turn we send what the agent SAID and
   speak back whatever the model answers. */
async function runSmartCall(p, opening) {
  const history = [];
  vcStatus(`${p.who} picked up`, "live");
  vcStatus(`${p.who} is talking…`, "them");
  vcCaption(p.who, opening);
  await vcSpeak(opening, p.voice);
  history.push({ role: "prospect", text: opening });
  if (VC.hangup) return;

  let turns = 0;
  while (!VC.hangup && turns < 24) {
    turns++;
    // the agent's turn
    vcStatus("Your turn — just talk. Tap “Done talking” when you finish.", "you");
    vcYou(""); document.getElementById("vc-hint").textContent = "";
    window.__vcModel = "Say who you really are, name the carrier, ask one honest question — and listen to the answer.";
    const doneBtn = document.querySelector(".vc-done"); if (doneBtn) doneBtn.disabled = false;
    const said = await vcListen(t => vcYou(t));
    if (VC.hangup) return;
    if (doneBtn) doneBtn.disabled = true;
    const agentText = (said || "").trim() || "(silence)";
    history.push({ role: "agent", text: agentText });

    // the prospect thinks and answers what was actually said
    vcStatus(`${p.who} is thinking…`, "them"); vcYou("");
    let resp;
    try { resp = await roleplayCall({ mode: "reply", persona: repBrief(p), history, last_agent: agentText }); }
    catch (e) { resp = { say: "Sorry hon, I've got to go. Bye now.", ended: true }; }
    if (VC.hangup) return;
    const say = (resp && resp.say) || "…";
    vcStatus(`${p.who} is talking…`, "them"); vcCaption(p.who, say);
    await vcSpeak(say, p.voice);
    history.push({ role: "prospect", text: say });
    if (resp && resp.ended) break;
  }

  VC.smartHistory = history;
  vcStatus("Call ended.", "");
  const ctr = document.querySelector(".vc-controls");
  if (ctr) ctr.innerHTML = `<button class="btn green" data-act="vc-score">See your scorecard →</button>
    <button class="btn sm ghost" data-act="vc-again">Call again</button>`;
}

/* the fallback: the scripted beats, spoken. Works with no key. */
async function runScriptedCall(p) {
  vcStatus(`${p.who} picked up`, "live");
  for (let i = 0; i < p.beats.length; i++) {
    if (VC.hangup) return;
    const b = p.beats[i];
    vcStatus(`${p.who} is talking…`, "them");
    vcCaption(p.who, b.them); vcYou("");
    document.getElementById("vc-hint").textContent = "";
    const doneBtn = document.querySelector(".vc-done"); if (doneBtn) doneBtn.disabled = true;
    await vcSpeak(b.them, p.voice);
    if (VC.hangup) return;
    vcStatus("Your turn — just talk. Tap “Done talking” when you finish.", "you");
    if (doneBtn) doneBtn.disabled = false;
    window.__vcModel = b.model;
    await vcListen(said => vcYou(said));
    if (VC.hangup) return;
  }
  vcStatus("Call ended.", "");
  vcCaption(p.who, "Alright, thanks — talk soon.");
  await vcSpeak("Alright, thanks — talk soon.", p.voice);
  if (VC.hangup) return;
  const hint = document.getElementById("vc-hint");
  if (hint) hint.innerHTML = `<div style="margin-top:6px">${esc(p.outcome)}</div>`;
  const ctr = document.querySelector(".vc-controls");
  if (ctr) ctr.innerHTML = `<button class="btn green" data-act="vc-score">See your scorecard →</button>
    <button class="btn sm ghost" data-act="vc-again">Call again</button>`;
}

/* ============================================================
   LOCAL SMART CALL — the free, keyless "listening" prospect.
   No account, no key, no backend, no cost. The browser hears the agent
   (SpeechRecognition); this engine reads what they actually said, decides
   whether they handled the current step, and reacts: it advances when the
   agent does the honest thing, pushes back with a real objection when they
   don't, and gets suspicious and hangs up if they fake authority or fish
   for bank details. It's pattern-based, not a language model, so it can't
   free-form like the keyed smart mode — but it genuinely reacts to what the
   agent says instead of running a fixed script. This is the honest trainer:
   cheating (pretext, "just verify the last four") makes the call HARDER.
   ============================================================ */
function lxNorm(s){ return " " + String(s||"").toLowerCase().replace(/[^a-z0-9]+/g," ").replace(/\s+/g," ").trim() + " "; }
function lxHas(t, ...ws){ return ws.some(w => t.indexOf(w) !== -1); }              // phrase / stem match
function lxWord(t, ...ws){ return ws.some(w => t.indexOf(" "+w+" ") !== -1); }      // whole-word match

function lxDishonest(t){
  return lxHas(t,"insurance department","department of insurance","producer registry",
    "under investigation","being investigated","clean slat","fraud division","fraud department",
    "social security administration","verify the last four","confirm the last four",
    "last four we already","just verify the last","already have on file","government agency","state regulator");
}
function lxOpen(t){
  const agency = lxHas(t,"closers collective") || lxWord(t,"closers");
  const lic    = lxWord(t,"licensed","agent") || lxHas(t,"insurance agent");
  const reason = lxHas(t,"final expense","following up","follow up","reaching out","reach out","sent in","mailed") || lxWord(t,"card","coverage","cover");
  return (agency || lic) && reason;
}
function lxQuestion(t, raw){
  if (raw && raw.indexOf("?") !== -1) return true;
  return lxWord(t,"what","who","when","which","how","remember","why") ||
    lxHas(t,"do you","did you","are you","would you","could you","have you","let me ask","can i ask","tell me","how much","how many","is that","does that","what about","how about");
}
function lxComfort(t){
  return lxWord(t,"comfortable","comfy","afford","budget","monthly","range") ||
    lxHas(t,"a month","per month","what feels","feel comfortable","works for you","fit your","in your range","comfortable number");
}
function lxValue(t){
  return lxHas(t,"day one","from day one","never goes up","never go up","cash value","more coverage","lower your payment","lower the payment","two options","whole life","pays out","builds value","build value","paid from day") ||
    lxWord(t,"borrow","carrier","option","options");
}
function lxAck(t){
  return lxWord(t,"fair","totally","understand","absolutely") ||
    lxHas(t,"i get it","i hear you","makes sense","good question","great question","no pressure","take your time","that is fair","of course","no problem","i understand","completely fair");
}
function lxCloseDeposit(t){
  return lxHas(t,"deposit","payday","get paid","check comes","check lands","check hits","social security","day after","after your check","after your pay","line it up","works with your check","when do you get","the day your check");
}
function lxClosePre(t){
  return lxHas(t,"call you before","give you a call before","couple days before","few days before","before the first","before that first","reach out before","make sure the money","make sure it is set","confirm it is all");
}
function lxAddressed(stage, t, raw){
  switch (stage){
    case "Open":      return lxOpen(t);
    case "Discovery": return lxQuestion(t, raw) || lxComfort(t);
    case "Present":   return lxValue(t) || lxComfort(t);
    case "Objection": return lxAck(t);
    case "Close":     return lxCloseDeposit(t) || lxClosePre(t);
    default:          return lxQuestion(t, raw);
  }
}
const LX_STALL = {
  Open:      ["Wait — who did you say you were, and who's this with?", "I've had a lot of these calls. What company are you with again?"],
  Discovery: ["Well… I'm not sure I follow. What is it you're actually asking me?", "Hm. I don't know what you need to know that for."],
  Present:   ["Okay, but… what are you actually offering me here?", "You still haven't told me what this does for me."],
  Objection: ["See, that's the part that worries me — you kind of talked right past it.", "Mm. I still feel like you're pushing past what I said."],
  Close:     ["Hang on — when exactly would money come out of my account?", "I don't want a surprise payment. How does that part work?"],
};
const LX_SUSPECT = [
  "Wait, now hold on. That doesn't sound right. Who are you really with?",
  "…A department? That's not who I mailed anything to. I'm not comfortable with this.",
  "No. I'm not giving you anything off my account. I think I'd better go. Goodbye.",
];
const LX_SOLD  = "You know… you've been straight with me and you didn't rush me. Alright, let's go ahead and do it. What do you need from me?";
const LX_THINK = "I don't know. Let me sit with it and talk to my family. Can you call me back another time?";

function lxWait(ms){ return new Promise(r => setTimeout(r, ms)); }

async function runLocalSmartCall(p){
  const log = [];
  const flags = { honestOpen:false, discovery:0, comfort:false, value:false, ack:false, closeDeposit:false, closePre:false };
  let i = 0, misses = 0, suspicion = 0, dishonest = false;

  const speakThem = async (text, stage) => {
    if (VC.hangup) return;
    vcStatus(`${p.who} is talking…`, "them");
    vcCaption(p.who, text);
    await vcSpeak(text, p.voice);
    log.push({ role:"prospect", text, stage });
  };

  vcStatus(`${p.who} picked up`, "live");
  await speakThem(p.beats[0].them, p.beats[0].stage);
  if (VC.hangup) return;

  let guard = 0;
  while (!VC.hangup && i < p.beats.length && guard < 40){
    guard++;
    const beat = p.beats[i];

    // the agent's turn
    vcStatus("Your turn — just talk. Tap “Done talking” when you finish.", "you");
    vcYou(""); const hintEl = document.getElementById("vc-hint"); if (hintEl) hintEl.textContent = "";
    window.__vcModel = beat.model;
    const doneBtn = document.querySelector(".vc-done"); if (doneBtn) doneBtn.disabled = false;
    const said = await vcListen(t => vcYou(t));
    if (VC.hangup) return;
    if (doneBtn) doneBtn.disabled = true;
    const agentText = (said || "").trim() || "(silence)";
    const raw = agentText.toLowerCase();
    const t = lxNorm(agentText);
    const entry = { role:"agent", text: agentText, stage: beat.stage };
    log.push(entry);

    // think a beat so the answer feels considered, not instant
    vcStatus(`${p.who} is thinking…`, "them"); vcYou("");
    await lxWait(600 + Math.min(1000, agentText.length * 12));
    if (VC.hangup) return;

    // dishonesty overrides everything — cheating makes the call harder
    if (lxDishonest(t)){
      dishonest = true; suspicion++;
      entry.verdict = "dishonest";
      const line = suspicion >= 2 ? LX_SUSPECT[2] : (suspicion === 1 ? LX_SUSPECT[0] : LX_SUSPECT[1]);
      await speakThem(line, "Suspicion");
      if (suspicion >= 2) break;   // they hang up
      continue;                    // same step, they still have to come clean
    }

    // bank the honest-skill flags for scoring
    if (lxComfort(t)) flags.comfort = true;
    if (lxValue(t)) flags.value = true;
    if (lxAck(t)) flags.ack = true;
    if (lxQuestion(t, raw)) flags.discovery++;
    if (beat.stage === "Open" && lxOpen(t)) flags.honestOpen = true;
    if (lxCloseDeposit(t)) flags.closeDeposit = true;
    if (lxClosePre(t)) flags.closePre = true;

    if (lxAddressed(beat.stage, t, raw)){
      entry.verdict = "good"; misses = 0; i++;
      if (i < p.beats.length) await speakThem(p.beats[i].them, p.beats[i].stage);
    } else {
      misses++; entry.verdict = "weak";
      const bank = LX_STALL[beat.stage] || LX_STALL.Discovery;
      if (misses >= 2){
        // don't trap them: grumble and move on, but it counts against the score
        misses = 0; i++;
        if (i < p.beats.length) await speakThem("…I suppose. " + p.beats[i].them, p.beats[i].stage);
      } else {
        await speakThem(bank[0], beat.stage);
      }
    }
  }

  // how it lands
  let sold;
  if (dishonest && suspicion >= 2){
    sold = false;   // hung up on a pretext — the closing line was already spoken
  } else {
    const earned = flags.honestOpen && flags.discovery >= 1 && flags.comfort && (flags.closeDeposit || flags.closePre) && !dishonest;
    sold = !!earned;
    await speakThem(sold ? LX_SOLD : LX_THINK, "Close");
  }

  VC.localLog = log;
  VC.localResult = { sold, dishonest, suspicion, flags };
  vcStatus(sold ? `${p.who} said yes.` : "Call ended.", "");
  const hint = document.getElementById("vc-hint");
  if (hint) hint.innerHTML = `<div style="margin-top:6px">${esc(sold ? "You earned it — honest open, real discovery, comfort-based ask, and you lined the draft to her deposit." : (dishonest ? "You leaned on a pretext and she bailed. Say who you are and ask straight — that's the whole game." : "She didn't say yes. Score it below and see the one fix that moves the needle."))}</div>`;
  const ctr = document.querySelector(".vc-controls");
  if (ctr) ctr.innerHTML = `<button class="btn green" data-act="vc-score">See your scorecard →</button>
    <button class="btn sm ghost" data-act="vc-again">Call again</button>`;
}

/* score the finished LOCAL call from what the agent actually did — no key */
function scoreLocalCall(){
  const r = VC.localResult || {}; const f = r.flags || {};
  const open      = f.honestOpen ? 9 : 4;
  const discovery = f.discovery >= 3 ? 9 : f.discovery === 2 ? 8 : f.discovery === 1 ? 6 : 3;
  const value     = f.value ? 8 : 4;
  const objection = f.ack ? 8 : 4;
  const price     = f.comfort ? 8 : 3;
  const close     = (f.closeDeposit && f.closePre) ? 9 : (f.closeDeposit || f.closePre) ? 6 : 3;
  let   rapport   = 7 - (r.suspicion || 0) * 3 + (f.ack ? 1 : 0);
  let scores = [open, discovery, value, objection, price, close, rapport];
  if (r.dishonest) scores = scores.map(n => Math.min(n, 2));   // dishonesty caps the whole call
  state.rep.scores = scores.map(n => Math.max(0, Math.min(10, Math.round(n))));

  const fixes = [
    "Open honest: say your name, that you're a licensed agent with Closers Collective, and the real reason you're calling.",
    "Ask more discovery — what they have now, who it protects, a comfortable monthly number — before you pitch anything.",
    "Build value honestly (day-one coverage, it never goes up, a real carrier) instead of jumping straight to price.",
    "Acknowledge the objection first — “totally fair” — then answer it. Don't steamroll past what they said.",
    "Anchor a comfortable monthly number before you ever name a price.",
    "Line the first draft up with their deposit day and promise a call a couple days before it.",
    "Slow down and listen — not rushing them is what earns the yes.",
  ];
  if (r.dishonest){
    state.rep.fix = "You leaned on a pretext (fake authority or the “last four” bank trick) and she bailed. That tanks the call and pulls your licence — say who you are and ask straight.";
    return;
  }
  let lo = 0; for (let i = 1; i < state.rep.scores.length; i++) if (state.rep.scores[i] < state.rep.scores[lo]) lo = i;
  state.rep.fix = fixes[lo];
}

/* score the finished smart call from the real transcript */
async function scoreSmartCall() {
  if (!VC.smartHistory || !VC.smartHistory.length) return;
  try {
    const out = await roleplayCall({ mode: "score", history: VC.smartHistory });
    const s = out.scores || {};
    state.rep.scores = [s.open, s.discovery, s.value, s.objection, s.price, s.close, s.rapport]
      .map(n => Math.max(0, Math.min(10, Math.round(Number(n) || 0))));
    state.rep.fix = out.fix || "";
  } catch (e) { /* leave the default 5s */ }
}

function endVoiceCall(toScore) {
  VC.hangup = true;
  try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {}
  try { if (VC.recog) VC.recog.abort ? VC.recog.abort() : VC.recog.stop(); } catch (e) {}
  VC.recog = null; VC.resolveTurn = null;
  const root = document.getElementById("callroot"); if (root) root.innerHTML = "";
  const p = REP_PROSPECTS[state.rep.pi % REP_PROSPECTS.length];
  if (toScore) { state.rep.beat = p.beats.length; if (!state.rep.scores) state.rep.scores = REP_DIMS.map(() => 5); }
  VC.smartHistory = null; VC.localLog = null; VC.localResult = null;
  render();
}

/* ---------- BOOK: every client, colour coded on where they stand ---------- */
/* the stripe says how they are doing on their calls; the tag says what the next call is */
const BOOK_STATES = {
  late:    { label: "Overdue",         colour: "#FF4D4D", blurb: "a call has gone past due" },
  today:   { label: "Due today",       colour: "#FFC24D", blurb: "a call is due today" },
  soon:    { label: "Coming up",       colour: "#2E8BFF", blurb: "a call inside the next 30 days" },
  current: { label: "All current",     colour: "#2BD98A", blurb: "booked, nothing needed yet" },
  none:    { label: "Nothing booked",  colour: "#5F708C", blurb: "no calls scheduled at all" },
};

function bookState(c) {
  const next = nextCallFor(c.id);
  if (!next) return { key: "none", next: null, days: null };
  const d = daysBetween(next.due_date);
  if (d < 0)  return { key: "late",    next, days: d };
  if (d === 0) return { key: "today",  next, days: d };
  if (d <= 30) return { key: "soon",   next, days: d };
  return { key: "current", next, days: d };
}
const BOOK_ORDER = { late: 0, today: 1, soon: 2, current: 3, none: 4 };

function bookKey() {
  return `<div class="legend">${Object.entries(BOOK_STATES).map(([k,v]) =>
    `<span><i style="background:${v.colour}"></i>${esc(v.label)}</span>`).join("")}</div>`;
}

function bookView() {
  const q = state.search.toLowerCase().trim();

  const all = state.clients.map(c => ({ c, st: bookState(c) }));
  const counts = Object.keys(BOOK_STATES).reduce((a,k) => (a[k] = all.filter(x => x.st.key === k).length, a), {});

  let rows = all;
  if (state.bookState !== "all") rows = rows.filter(x => x.st.key === state.bookState);
  if (q) rows = rows.filter(x => matches(x.c, q));
  rows = rows.slice().sort((a,b) => {
    if (BOOK_ORDER[a.st.key] !== BOOK_ORDER[b.st.key]) return BOOK_ORDER[a.st.key] - BOOK_ORDER[b.st.key];
    const ad = a.st.next?.due_date || "9999-99-99", bd = b.st.next?.due_date || "9999-99-99";
    if (ad !== bd) return ad < bd ? -1 : 1;
    return (a.c.full_name || "").localeCompare(b.c.full_name || "");
  });

  const sold = state.clients.filter(isSold);
  const ap = sold.reduce((t,c) => t + (Number(c.monthly_premium) || 0), 0);
  const chips = [["all","Everyone"]].concat(
    Object.entries(BOOK_STATES).filter(([k]) => counts[k] > 0).map(([k,v]) => [k, v.label]));

  return `
  <div class="page-head">
    <h2 class="display">My book.</h2>
    <p class="sub">${state.clients.length} client${state.clients.length===1?"":"s"}${
      ap ? ` &middot; ${money(ap)}/mo &middot; ${money(ap*12)} a year` : ""}${
      counts.late ? ` &middot; <strong style="color:var(--red)">${counts.late} overdue</strong>` : ""}.</p>
  </div>

  <div class="tiles">
    <div class="tile"><div class="n ${counts.late?"red":""}">${counts.late}</div><div class="l">Overdue</div></div>
    <div class="tile"><div class="n">${counts.today}</div><div class="l">Due today</div></div>
    <div class="tile"><div class="n">${counts.soon}</div><div class="l">Coming up</div></div>
    <div class="tile"><div class="n">${counts.current + counts.none}</div><div class="l">Nothing needed</div></div>
  </div>

  ${bookKey()}

  <div class="toolbar" style="margin-bottom:16px">
    <input class="input" placeholder="Search name, phone, carrier\u2026" value="${esc(state.search)}" data-act="search">
    <div class="chips">${chips.map(([v,l]) =>
      `<button class="chip ${state.bookState===v?"on":""}" data-act="bookstate" data-v="${v}">${esc(l)}</button>`).join("")}</div>
    <span class="spacer"></span>
    <button class="btn ghost sm" data-act="export">Export CSV</button>
    <button class="btn green sm" data-act="new">New client</button>
  </div>

  ${rows.length === 0 ? `<div class="empty">
      <div class="big">${q ? "No match." : state.clients.length ? "Nobody in that group." : "Your book is empty."}</div>
      <div style="margin-bottom:${state.clients.length ? "0" : "16px"}">${
        q ? "Nobody in your book matches that search."
          : state.clients.length ? "Try Everyone."
          : "Add your first client and they will show up here with their calls."}</div>
      ${state.clients.length ? "" : `<button class="btn green" data-act="new">New client</button>`}
    </div>`
  : rows.map(({c, st}) => {
      const v = BOOK_STATES[st.key];
      const k = st.next ? kindKey(st.next) : null;
      const tries = Number(st.next?.attempts || 0);
      const when = st.key === "late"    ? `${Math.abs(st.days)} day${Math.abs(st.days)===1?"":"s"} late`
                 : st.key === "today"   ? "Due today"
                 : st.next              ? `in ${st.days} day${st.days===1?"":"s"}`
                 : "No calls booked";
      return `<div class="bookrow st-${st.key}" data-act="open" data-id="${c.id}">
        <div class="bk-body">
          <div class="bk-name">${esc((c.full_name || "").trim() || "Unnamed")}</div>
          <div class="bk-meta">
            <span class="tag st-${st.key}">${esc(v.label)}</span>
            ${k ? `<span class="tag k-${k}">${esc(KINDS[k].label)}</span>` : ""}
            ${tries > 0 ? `<span class="tag tries">no answer ${tries}&times;</span>` : ""}
            ${c.phone ? `<span>${esc(c.phone)}</span>` : `<span style="color:var(--red)">No phone on file</span>`}
            ${c.date_of_birth ? `<span>age ${age(c.date_of_birth)}</span>` : ""}
            ${c.carrier ? `<span>${esc(c.carrier)}</span>` : ""}
          </div>
          <div class="bk-sub">${esc(when)}${st.next ? ` &middot; ${esc(prettyDate(st.next.due_date))}` : ""}${
            isSold(c) ? ` &middot; sold ${esc(prettyDate(c.sale_date))}` : " &middot; no sale date"}${
            c.policy_start_date ? ` &middot; pays the ${ordinal(parseISO(c.policy_start_date).getDate())}` : ""}</div>
        </div>
        <div class="bk-right">
          ${c.monthly_premium ? `<div class="bk-prem">${money(c.monthly_premium)}<span>/mo</span></div>` : ""}
          ${c.coverage_amount ? `<div style="font-size:12px;color:var(--txt-3);margin-top:3px">${money(c.coverage_amount)} face</div>` : ""}
        </div>
      </div>`;
    }).join("")}`;
}

/* ---------- PIPELINE: leads and the book, one page ---------- */
function pipelineView() {
  const q = state.search.toLowerCase().trim();
  const workable = state.leads.filter(isWorkable);
  const dueLate  = workable.filter(l => l.callback_at && daysBetween(l.callback_at) <  0);
  const dueNow   = workable.filter(l => l.callback_at && daysBetween(l.callback_at) === 0);
  const due      = dueLate.length + dueNow.length;

  const rows = state.leads.filter(l => {
    if (state.leadFilter === "open" && !isWorkable(l)) return false;
    if (state.leadFilter === "dead" && isWorkable(l))  return false;
    if (!q) return true;
    return `${l.full_name} ${l.phone} ${l.city} ${l.source}`.toLowerCase().includes(q);
  }).sort((a,b) => {
    const av = a.callback_at || "9999-99-99", bv = b.callback_at || "9999-99-99";
    if (av !== bv) return av < bv ? -1 : 1;
    return (a.full_name || "").localeCompare(b.full_name || "");
  });
  const chips = [["open","Working"],["dead","Closed out"],["all","Everyone"]];

  return `
  <div class="page-head">
    <h2 class="display">Pipeline.</h2>
    <p class="sub">${workable.length} lead${workable.length===1?"":"s"} still worth a call, out of ${state.leads.length}${
      due ? ` &middot; ${due} to call back now` : " &middot; nothing due"}. Once they buy, they move to your book.</p>
  </div>

  ${state.importRows ? importReview() : importPaste()}

  ${due ? `<div class="banner ${dueLate.length ? "hot" : ""}">
    <div class="bignum num">${due}</div>
    <div class="btext">
      <div class="bhead">${dueLate.length
        ? `${dueLate.length} callback${dueLate.length===1?"":"s"} overdue${dueNow.length ? `, ${dueNow.length} due today` : ""}.`
        : `${dueNow.length} callback${dueNow.length===1?"":"s"} due today.`}</div>
      <div class="bsub">They are at the top of the list, marked in red.</div>
    </div>
  </div>` : ""}

  ${state.importRows ? "" : `
    <div class="toolbar">
      <input class="input" placeholder="Search name, phone, city\u2026" value="${esc(state.search)}" data-act="search">
      <div class="chips">${chips.map(([v,l]) =>
        `<button class="chip ${state.leadFilter===v?"on":""}" data-act="leadfilter" data-v="${v}">${l}</button>`).join("")}</div>
      <span class="spacer"></span>
      <button class="btn ghost sm" data-act="exportleads">Export CSV</button>
      <button class="btn green sm" data-act="newlead">Add by hand</button>
    </div>
  `}

  ${state.importRows ? "" : rows.length === 0 ? `<div class="empty">
      <div class="big">${q ? "No match." : "No leads yet."}</div>
      <div>${q ? "Nobody matches that search."
        : "Drop a screenshot of your lead table above and they will appear here."}</div>
    </div>`
  : leadTable(rows)}`;
}

function banner(late, now) {
  const all = [...late, ...now];
  if (!all.length) return "";

  const n = k => all.filter(r => r.kind === k).length;
  const draft     = n("pre_draft");
  const milestone = n("milestone");
  const bday      = n("birthday");
  const plain     = all.length - draft - milestone - bday;

  const bits = [];
  if (draft)     bits.push(`<strong>${draft}</strong> before a first draft`);
  if (milestone) bits.push(`<strong>${milestone}</strong> persistency check${milestone>1?"s":""}`);
  if (bday)      bits.push(`<strong>${bday}</strong> birthday${bday>1?"s":""}`);
  if (plain)     bits.push(`<strong>${plain}</strong> follow-up${plain>1?"s":""}`);

  const hot = late.length > 0;
  const head = hot
    ? `${late.length} ${late.length === 1 ? "call is" : "calls are"} overdue.`
    : `${now.length} ${now.length === 1 ? "call" : "calls"} due today.`;
  const money = draft > 0
    ? ` The draft calls are the ones that decide whether you keep the commission.`
    : ``;

  return `<div class="banner ${hot ? "hot" : ""}">
    <div class="bignum num">${all.length}</div>
    <div class="btext">
      <div class="bhead">${esc(head)}${money ? `<span style="font-weight:400;color:var(--txt-2)">${money}</span>` : ""}</div>
      <div class="bsub">${bits.join(" &nbsp;&middot;&nbsp; ")}</div>
    </div>
  </div>`;
}

function nameOfRem(r) {
  const c = r.clients || {};

function callBlock(title, rows, cls) {
  if (!rows.length) return "";

    ${rows.map(r => callRow(r, cls)).join("")}

function callRow(r, cls) {
  const c = r.clients || {};

  const lateTag = daysBetween(r.due_date) < 0 ? `<span class="tag late">${relDay(r.due_date)}</span>` : "";
  const tries = Number(r.attempts || 0);
  const tryTag = tries > 0
    ? `<span class="tag tries">${ordinal(tries + 1)} try &middot; no answer ${tries} time${tries===1?"":"s"}</span>` : "";
  const start = c.policy_start_date
    ? `<span>Starts ${prettyDate(c.policy_start_date)} &middot; pays that day</span>` : "";

  return `<div class="call k-${k}${cls === "late" ? " od" : ""}">
    <div class="call-body">
      <div class="call-name"><a data-act="open" data-id="${c.id}">${esc(name)}</a></div>
      <div class="call-meta">
        ${kindChip}${lateTag}${tryTag}
        ${c.phone ? `<span>${esc(c.phone)}</span>` : `<span style="color:var(--red)">No phone on file</span>`}
        <span class="tag plain">${esc(prettyDate(r.due_date))}</span>
        ${c.carrier ? `<span>${esc(c.carrier)}</span>` : ""}
        ${start}
      </div>
      ${r.note ? `<div class="call-note">${esc(r.note)}</div>` : ""}
    </div>
    <div class="call-acts">
      ${c.phone ? `<a class="btn green sm" href="${telHref(c.phone)}" data-act="dial" data-rid="${r.id}" data-id="${c.id}">Call</a>` : ""}
      <button class="btn ghost sm" data-act="talked" data-rid="${r.id}" data-id="${c.id}">Talked to</button>
      <button class="btn quiet sm" data-act="noanswer" data-rid="${r.id}" data-id="${c.id}">No answer</button>
    </div>
  </div>`;
}
function ordinal(n){
  const s = ["th","st","nd","rd"], v = n % 100;
  return n + (s[(v-20)%10] || s[v] || s[0]);
}

/* ---------- LEADS (the list and the callbacks are one page) ---------- */
/* ---------- the lead sheet, used by Pipeline ---------- */
function leadTable(rows) {
  return `<div class="table-wrap"><table>

            l.status==="new"       ? "s-new" : "s-lost"}"></span>${esc(LEAD_STATUS[l.status])}</span></td>
        <td>${l.city ? esc(l.city) + (l.state ? ", " + esc(l.state) : "") : "\u2014"}</td>
        <td class="r">${l.call_count || 0}</td>
        <td style="max-width:280px;color:var(--txt-3);font-size:13px">${esc(note.length > 70 ? note.slice(0,70) + "\u2026" : note) || "\u2014"}</td>
        <td class="r">${l.phone ? `<a class="btn green sm" href="${telHref(l.phone)}" data-act="dialLead" data-id="${l.id}">Call</a>` : ""}</td>

}

/* ---------- paste your lead list ----------

   is exact — no photograph of a screen to squint at, no reader to be wrong.

function importPaste() {
  if (state.importBusy) {
    return `<div class="dropzone busy">
      <div class="dz-inner">
        <div class="dz-title">Reading it now…</div>
        <div class="dz-sub">${esc(state.importStage || "A few seconds. Do not close the page.")}</div>

      </div>
    </div>
    ${state.importError ? `<div class="notice bad">${esc(state.importError)}</div>` : ""}`;

  return `<div class="pastebox">

/* ---------- screenshot import ---------- */

  if (!startISO) return `<p style="font-size:12.5px;color:var(--txt-3);margin:-4px 0 16px;line-height:1.55">
    <strong>The start date is the day they pay.</strong> Put it in and the calls book themselves:

    plus their birthday.</p>`;
  const st = parseISO(startISO);
  return `<div class="hint">

    <br>Call to make sure the money is there: <strong>${esc(prettyDate(isoPlus(-PRE_DRAFT_DAYS, st)))}</strong>
  </div>`;
}
